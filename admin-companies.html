
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manage Companies</title>

    <link rel="stylesheet" href="./css/style.css">

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="nav-content">


            <!-- LOGO -->

            <a
                href="admin-dashboard.html"
                class="brand"
            >

                <img
                    src="./images/logo.png"
                    alt="Internship Management System Logo"
                >

                <span>
                    Internship Management System
                </span>

            </a>


            <!-- NAVIGATION -->

            <nav class="nav-links">

                <a href="admin-dashboard.html">
                    Dashboard
                </a>

                <a
                    href="admin-companies.html"
                    class="active"
                >
                    Companies
                </a>

                <a href="admin-profile.html">
                    Profile
                </a>

                <a
                    href="index.html"
                    class="logout"
                >
                    Logout
                </a>

            </nav>

        </div>

    </header>



    <!-- ================= COMPANIES PAGE ================= -->

    <main class="admin-companies-page">


        <a
            href="admin-dashboard.html"
            class="admin-back"
        >
            ← Back to Dashboard
        </a>



        <!-- Page Header -->

        <section class="admin-company-header">

            <p class="admin-section-label">
                ADMINISTRATION
            </p>

            <h1>
                Manage Companies
            </h1>

            <p>
                View and manage registered company accounts.
            </p>

        </section>



        <!-- ================= COMPANIES CARD ================= -->

        <section class="admin-companies-card">


            <!-- Toolbar -->

            <div class="admin-companies-toolbar">

                <div class="admin-company-search">

                    <input
                        type="text"
                        id="companySearch"
                        placeholder="Search companies..."
                    >

                </div>

            </div>



            <!-- ================= COMPANY LIST ================= -->

            <div
                class="admin-company-list"
                id="companiesList"
            >

                <div class="admin-company-item">

                    <div class="admin-company-info">

                        <h3>
                            Loading...
                        </h3>

                        <p>
                            Loading companies
                        </p>

                        <span>
                            Please wait...
                        </span>

                    </div>

                </div>

            </div>

        </section>


    </main>



    <!-- ================= SUPABASE ================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="./js/supabase.js"></script>



    <!-- ================= JAVASCRIPT ================= -->

    <script>

        /* =========================================
           ELEMENTS
        ========================================== */

        const companySearch =
            document.getElementById("companySearch");

        const companiesList =
            document.getElementById("companiesList");


        let companies = [];



        /* =========================================
           CHECK ADMIN
        ========================================== */

        async function checkAdmin() {

            const {
                data: { user },
                error: userError
            } = await db.auth.getUser();


            if (userError || !user) {

                window.location.href = "index.html";

                return false;

            }


            const {
                data: profile,
                error: profileError
            } = await db
                .from("profiles")
                .select("role")
                .eq("id", user.id)
                .maybeSingle();


            if (
                profileError ||
                !profile ||
                profile.role !== "admin"
            ) {

                alert(
                    "You do not have permission to access this page."
                );

                window.location.href =
                    "admin-dashboard.html";

                return false;

            }


            return true;

        }



        /* =========================================
           LOAD COMPANIES
        ========================================== */

        async function loadCompanies() {

            try {

                const {
                    data,
                    error
                } = await db
                    .from("companies")
                    .select(`
                        id,
                        profile_id,
                        name,
                        email,
                        phone,
                        city,
                        field,
                        website,
                        logo_url,
                        description,
                        status,
                        created_at
                    `)
                    .order("created_at", {
                        ascending: false
                    });


                if (error) {

                    console.error(
                        "Companies error:",
                        error
                    );

                    companiesList.innerHTML = `

                        <div class="admin-company-item">

                            <div class="admin-company-info">

                                <h3>
                                    Unable to load companies
                                </h3>

                                <p>
                                    Please check your database permissions.
                                </p>

                            </div>

                        </div>

                    `;

                    return;

                }


                companies = data || [];


                renderCompanies();

            } catch (error) {

                console.error(
                    "Load companies error:",
                    error
                );

            }

        }



        /* =========================================
           RENDER COMPANIES
        ========================================== */

        function renderCompanies() {

            const searchValue =
                companySearch.value
                    .trim()
                    .toLowerCase();


            const filteredCompanies =
                companies.filter(company => {

                    const companyName =
                        (company.name || "")
                            .toLowerCase();


                    const matchesSearch =
                        companyName.includes(
                            searchValue
                        );


                    return matchesSearch;

                });


            companiesList.innerHTML = "";


            if (
                filteredCompanies.length === 0
            ) {

                companiesList.innerHTML = `

                    <div class="admin-company-item">

                        <div class="admin-company-info">

                            <h3>
                                No companies found
                            </h3>

                            <p>
                                No company matches your search.
                            </p>

                        </div>

                    </div>

                `;

                return;

            }



            filteredCompanies.forEach(
                company => {

                    const status =
                        (
                            company.status ||
                            "pending"
                        ).toLowerCase();


                    const statusText =
                        status.charAt(0)
                            .toUpperCase()
                        +
                        status.slice(1);



                    /* =================================
                       COMPANY LOGO
                    ================================== */

                    let logoHTML = "";


                    if (company.logo_url) {

                        logoHTML = `

                            <img
                                src="${company.logo_url}"
                                alt="${escapeHTML(
                                    company.name ||
                                    "Company"
                                )}"
                            >

                        `;

                    } else {

                        const initials =
                            getInitials(
                                company.name
                            );


                        logoHTML = `

                            <div class="admin-company-logo-text">

                                ${escapeHTML(initials)}

                            </div>

                        `;

                    }



                    /* =================================
                       COMPANY ITEM
                    ================================== */

                    companiesList.innerHTML += `

                        <div
                            class="admin-company-item"
                            data-status="${escapeHTML(status)}"
                        >


                            <div class="admin-company-logo">

                                ${logoHTML}

                            </div>



                            <div class="admin-company-info">

                                <h3>
                                    ${escapeHTML(
                                        company.name ||
                                        "Unnamed Company"
                                    )}
                                </h3>

                                <p>
                                    ${escapeHTML(
                                        company.field ||
                                        "Company"
                                    )}
                                </p>

                                <span>
                                    ${escapeHTML(
                                        company.email ||
                                        "No email available"
                                    )}
                                </span>

                            </div>



                            <div class="admin-company-location">

                                ${escapeHTML(
                                    company.city ||
                                    "Not specified"
                                )}

                            </div>



                            <div
                                class="admin-company-status ${escapeHTML(status)}"
                            >

                                ${escapeHTML(statusText)}

                            </div>



                            <div class="admin-company-actions">


                                <a
                                    href="admin-company-view.html?id=${encodeURIComponent(
                                        company.id
                                    )}"
                                    class="admin-company-view"
                                >
                                    View
                                </a>



                                <button
                                    type="button"
                                    class="admin-company-delete"
                                    onclick="deleteCompany(
                                        '${company.id}',
                                        this
                                    )"
                                >
                                    Delete
                                </button>


                            </div>


                        </div>

                    `;

                }
            );

        }



        /* =========================================
           GET INITIALS
        ========================================== */

        function getInitials(name) {

            if (!name) {

                return "CO";

            }


            const words =
                name
                    .trim()
                    .split(/\s+/);


            if (words.length === 1) {

                return words[0]
                    .substring(0, 2)
                    .toUpperCase();

            }


            return (
                words[0].charAt(0) +
                words[1].charAt(0)
            ).toUpperCase();

        }



        /* =========================================
           ESCAPE HTML
        ========================================== */

        function escapeHTML(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }



        /* =========================================
           DELETE COMPANY
        ========================================== */

        async function deleteCompany(
            companyId,
            button
        ) {

            const company =
                companies.find(
                    item =>
                        item.id === companyId
                );


            if (!company) {

                return;

            }


            const confirmed =
                confirm(
                    `Are you sure you want to delete ${company.name}?`
                );


            if (!confirmed) {

                return;

            }



            button.disabled = true;

            button.textContent =
                "Deleting...";


            try {

                const {
                    error
                } = await db
                    .from("companies")
                    .delete()
                    .eq("id", companyId);


                if (error) {

                    console.error(
                        "Delete company error:",
                        error
                    );


                    alert(
                        "Unable to delete the company. Please try again."
                    );


                    button.disabled = false;

                    button.textContent =
                        "Delete";

                    return;

                }



                /* ================================
                   REMOVE FROM LOCAL ARRAY
                ================================= */

                companies =
                    companies.filter(
                        item =>
                            item.id !== companyId
                    );


                renderCompanies();


                alert(
                    "Company deleted successfully."
                );


            } catch (error) {

                console.error(
                    "Delete company error:",
                    error
                );


                alert(
                    "An unexpected error occurred."
                );


                button.disabled = false;

                button.textContent =
                    "Delete";

            }

        }



        /* =========================================
           SEARCH
        ========================================== */

        companySearch.addEventListener(
            "input",
            renderCompanies
        );



        /* =========================================
           INITIALIZE
        ========================================== */

        async function initializePage() {

            const isAdmin =
                await checkAdmin();


            if (!isAdmin) {

                return;

            }


            await loadCompanies();

        }


        initializePage();

    </script>


</body>

</html>
