
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manage Students</title>

    <link rel="stylesheet" href="./css/style.css">

</head>


<body>


   
<!-- =========================================
     NAVBAR
========================================== -->

<header class="navbar">

    <div class="nav-content">


        <!-- LOGO -->

        <a
            href="admin-dashboard.html"
            class="brand"
        >

            <img
                src="./images/logo.png"
                alt="Internship Management System Logo"
            >

            <span>
                Internship Management System
            </span>

        </a>


        <!-- NAVIGATION -->

        <nav class="nav-links">

            <a href="admin-dashboard.html">
                Dashboard
            </a>
<a
                    href="admin-companies.html"
                    class="active"
                >
                    Students
                </a>

            <a href="admin-profile.html">
                Profile
            </a>

            <a
                href="index.html"
                class="logout"
            >
                Logout
            </a>

        </nav>

    </div>

</header>


    <!-- ================= STUDENTS PAGE ================= -->

    <main class="admin-students-page">


        <a href="admin-dashboard.html" class="admin-back">
            ← Back to Dashboard
        </a>


        <!-- Page Header -->

        <section class="admin-page-header">

            <p class="admin-section-label">
                ADMINISTRATION
            </p>

            <h1>
                Manage Students
            </h1>

            <p>
                View and manage registered student accounts.
            </p>

        </section>



        <!-- ================= FILTERS ================= -->

        <section class="admin-students-card">

            <div class="admin-students-toolbar">

                <div class="admin-search">

                    <input
                        type="text"
                        id="studentSearch"
                        placeholder="Search students..."
                    >

                </div>


                <div class="admin-filter">

                    <select id="studentStatus">

                        <option value="all">
                            All Status
                        </option>

                        <option value="active">
                            Active
                        </option>

                        <option value="completed">
                            Completed
                        </option>

                        <option value="pending">
                            Pending
                        </option>

                    </select>

                </div>

            </div>



            <!-- ================= STUDENTS LIST ================= -->

            <div
                class="admin-students-list"
                id="studentsList"
            >

                <div class="admin-student-item">

                    <div class="admin-student-info">

                        <h3>
                            Loading students...
                        </h3>

                        <p>
                            Please wait
                        </p>

                    </div>

                </div>

            </div>

        </section>


    </main>



    <!-- ================= SUPABASE ================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="./js/supabase.js"></script>



    <!-- ================= JAVASCRIPT ================= -->

    <script>

        /* =========================================
           ELEMENTS
        ========================================= */

        const searchInput =
            document.getElementById("studentSearch");


        const statusFilter =
            document.getElementById("studentStatus");


        const studentsList =
            document.getElementById("studentsList");



        /* =========================================
           GET TODAY AS YYYY-MM-DD
        ========================================= */

        function getTodayString() {

            const today = new Date();

            const year =
                today.getFullYear();

            const month =
                String(
                    today.getMonth() + 1
                ).padStart(2, "0");

            const day =
                String(
                    today.getDate()
                ).padStart(2, "0");

            return `${year}-${month}-${day}`;

        }



        /* =========================================
           LOAD STUDENTS
        ========================================= */

        async function loadStudents() {

            try {


                /* =========================================
                   GET STUDENT PROFILES
                ========================================= */

                const {
                    data: profiles,
                    error: profilesError
                } = await db

                    .from("profiles")

                    .select(
                        "id, full_name, username, email, role"
                    )

                    .eq(
                        "role",
                        "student"
                    )

                    .order(
                        "full_name",
                        {
                            ascending: true
                        }
                    );


                if (profilesError) {

                    console.error(
                        "Students loading error:",
                        profilesError
                    );


                    showMessage(
                        "Unable to load students",
                        "Please try again."
                    );

                    return;

                }



                /* =========================================
                   NO STUDENTS
                ========================================= */

                if (
                    !profiles ||
                    profiles.length === 0
                ) {

                    showMessage(
                        "No students found",
                        "No registered students are available."
                    );

                    return;

                }



                /* =========================================
                   GET STUDENT DETAILS
                ========================================= */

                const profileIds =
                    profiles.map(
                        profile => profile.id
                    );


                const {
                    data: studentDetails,
                    error: studentsError
                } = await db

                    .from("students")

                    .select("*")

                    .in(
                        "id",
                        profileIds
                    );


                if (studentsError) {

                    console.error(
                        "Student details error:",
                        studentsError
                    );

                }



                /* =========================================
                   GET APPLICATIONS
                ========================================= */

                const {
                    data: applications,
                    error: applicationsError
                } = await db

                    .from("applications")

                    .select(
                        "id, student_id, internship_id, status, applied_at"
                    );


                if (applicationsError) {

                    console.error(
                        "Applications error:",
                        applicationsError
                    );

                    showMessage(
                        "Unable to load applications",
                        "Please check the application permissions."
                    );

                    return;

                }



                /* =========================================
                   GET INTERNSHIPS
                ========================================= */

                const internshipIds =
                    [
                        ...new Set(
                            (applications || [])
                                .map(
                                    application =>
                                        application.internship_id
                                )
                                .filter(Boolean)
                        )
                    ];


                let internships = [];


                if (
                    internshipIds.length > 0
                ) {

                    const {
                        data: internshipData,
                        error: internshipsError
                    } = await db

                        .from("internships")

                        .select(
                            "id, title, start_date, end_date, status"
                        )

                        .in(
                            "id",
                            internshipIds
                        );


                    if (internshipsError) {

                        console.error(
                            "Internships error:",
                            internshipsError
                        );

                        showMessage(
                            "Unable to load internships",
                            "Please check the internship permissions."
                        );

                        return;

                    }


                    internships =
                        internshipData || [];

                }



                /* =========================================
                   CLEAR LIST
                ========================================= */

                studentsList.innerHTML = "";



                /* =========================================
                   TODAY
                ========================================= */

                const todayString =
                    getTodayString();



                /* =========================================
                   CREATE STUDENT ITEMS
                ========================================= */

                profiles.forEach(
                    function (profile) {


                        /* =========================================
                           STUDENT DETAILS
                        ========================================= */

                        const details =
                            studentDetails?.find(
                                student =>
                                    student.id ===
                                    profile.id
                            );



                        /* =========================================
                           NAME
                        ========================================= */

                        const name =
                            profile.full_name ||
                            profile.username ||
                            "Student";



                        /* =========================================
                           EMAIL
                        ========================================= */

                        const email =
                            profile.email ||
                            "No email";



                        /* =========================================
                           MAJOR
                        ========================================= */

                        const major =
                            details?.major ||
                            "Computer Engineering";



                        /* =========================================
                           INITIALS
                        ========================================= */

                        const initials =
                            name
                                .split(" ")
                                .filter(Boolean)
                                .slice(0, 2)
                                .map(
                                    word =>
                                        word
                                            .charAt(0)
                                            .toUpperCase()
                                )
                                .join("");



                        /* =========================================
                           STUDENT APPLICATIONS
                        ========================================= */

                        const studentApplications =
                            (applications || [])
                                .filter(
                                    application =>
                                        application.student_id ===
                                        profile.id
                                )
                                .sort(
                                    (a, b) =>
                                        new Date(
                                            b.applied_at || 0
                                        ) -
                                        new Date(
                                            a.applied_at || 0
                                        )
                                );



                        /* =========================================
                           ACCEPTED APPLICATION
                        ========================================= */

                        const acceptedApplication =
                            studentApplications.find(
                                application =>
                                    (
                                        application.status ||
                                        ""
                                    ).toLowerCase() ===
                                    "accepted"
                            );



                        /* =========================================
                           PENDING APPLICATION
                        ========================================= */

                        const pendingApplication =
                            studentApplications.find(
                                application =>
                                    (
                                        application.status ||
                                        ""
                                    ).toLowerCase() ===
                                    "pending"
                            );



                        /* =========================================
                           DEFAULT STATUS
                        ========================================= */

                        let studentStatus =
                            "active";



                        /* =========================================
                           ACCEPTED
                        ========================================= */

                        if (
                            acceptedApplication
                        ) {

                            const acceptedInternship =
                                internships.find(
                                    internship =>
                                        internship.id ===
                                        acceptedApplication.internship_id
                                );


                            if (
                                acceptedInternship &&
                                acceptedInternship.end_date
                            ) {

                                const endDate =
                                    String(
                                        acceptedInternship.end_date
                                    ).substring(
                                        0,
                                        10
                                    );


                                /*
                                 * Compare YYYY-MM-DD strings.
                                 * This avoids timezone problems.
                                 */

                                if (
                                    endDate <
                                    todayString
                                ) {

                                    studentStatus =
                                        "completed";

                                }

                                else {

                                    studentStatus =
                                        "active";

                                }

                            }

                            else {

                                studentStatus =
                                    "active";

                            }

                        }



                        /* =========================================
                           PENDING
                        ========================================= */

                        else if (
                            pendingApplication
                        ) {

                            studentStatus =
                                "pending";

                        }



                        /* =========================================
                           STATUS TEXT
                        ========================================= */

                        let statusText =
                            "Active";


                        if (
                            studentStatus ===
                            "completed"
                        ) {

                            statusText =
                                "Completed";

                        }

                        else if (
                            studentStatus ===
                            "pending"
                        ) {

                            statusText =
                                "Pending";

                        }



                        /* =========================================
                           CREATE ITEM
                        ========================================= */

                        const studentItem =
                            document.createElement("div");


                        studentItem.className =
                            "admin-student-item";


                        studentItem.dataset.status =
                            studentStatus;


                        studentItem.dataset.id =
                            profile.id;



                        studentItem.innerHTML = `

                            <div class="admin-student-avatar">
                                ${initials}
                            </div>


                            <div class="admin-student-info">

                                <h3>
                                    ${escapeHtml(name)}
                                </h3>

                                <p>
                                    ${escapeHtml(major)}
                                </p>

                                <span>
                                    ${escapeHtml(email)}
                                </span>

                            </div>


                            <div class="admin-student-status ${studentStatus}">
                                ${statusText}
                            </div>


                            <div class="admin-student-actions">

                                <a
                                    href="admin-student-view.html?id=${profile.id}"
                                    class="admin-view-button"
                                >
                                    View
                                </a>


                                <button
                                    type="button"
                                    class="admin-delete-button"
                                    onclick="deleteStudent(this, '${profile.id}')"
                                >
                                    Delete
                                </button>

                            </div>

                        `;


                        studentsList.appendChild(
                            studentItem
                        );

                    }
                );


                /* =========================================
                   APPLY FILTER
                ========================================= */

                filterStudents();


            }

            catch (error) {

                console.error(
                    "Students error:",
                    error
                );


                showMessage(
                    "Unable to load students",
                    "An unexpected error occurred."
                );

            }

        }



        /* =========================================
           SHOW MESSAGE
        ========================================= */

        function showMessage(
            title,
            description
        ) {

            studentsList.innerHTML = `

                <div class="admin-student-item">

                    <div class="admin-student-info">

                        <h3>
                            ${escapeHtml(title)}
                        </h3>

                        <p>
                            ${escapeHtml(description)}
                        </p>

                    </div>

                </div>

            `;

        }



        /* =========================================
           ESCAPE HTML
        ========================================= */

        function escapeHtml(value) {

            if (!value) {
                return "";
            }


            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }



        /* =========================================
           FILTER STUDENTS
        ========================================= */

        function filterStudents() {

            const searchValue =
                searchInput.value
                    .toLowerCase()
                    .trim();


            const statusValue =
                statusFilter.value;


            const students =
                document.querySelectorAll(
                    ".admin-student-item"
                );


            students.forEach(
                function (student) {

                    const nameElement =
                        student.querySelector(
                            ".admin-student-info h3"
                        );


                    const majorElement =
                        student.querySelector(
                            ".admin-student-info p"
                        );


                    const emailElement =
                        student.querySelector(
                            ".admin-student-info span"
                        );


                    const name =
                        nameElement
                            ? nameElement.textContent
                                .toLowerCase()
                            : "";


                    const major =
                        majorElement
                            ? majorElement.textContent
                                .toLowerCase()
                            : "";


                    const email =
                        emailElement
                            ? emailElement.textContent
                                .toLowerCase()
                            : "";


                    const status =
                        student.dataset.status;


                    const matchesSearch =
                        name.includes(searchValue) ||
                        major.includes(searchValue) ||
                        email.includes(searchValue);


                    const matchesStatus =
                        statusValue === "all" ||
                        status === statusValue;


                    if (
                        matchesSearch &&
                        matchesStatus
                    ) {

                        student.style.display =
                            "flex";

                    }

                    else {

                        student.style.display =
                            "none";

                    }

                }
            );

        }



        /* =========================================
           SEARCH EVENT
        ========================================= */

        searchInput.addEventListener(
            "input",
            filterStudents
        );



        /* =========================================
           STATUS EVENT
        ========================================= */

        statusFilter.addEventListener(
            "change",
            filterStudents
        );



        /* =========================================
           DELETE STUDENT
        ========================================= */

        async function deleteStudent(
            button,
            studentId
        ) {

            const student =
                button.closest(
                    ".admin-student-item"
                );


            if (!student) {
                return;
            }


            const studentName =
                student
                    .querySelector(
                        ".admin-student-info h3"
                    )
                    .textContent;


            const confirmed =
                confirm(
                    "Are you sure you want to delete " +
                    studentName +
                    "?"
                );


            if (!confirmed) {
                return;
            }


            try {

                const {
                    error
                } = await db

                    .from("profiles")

                    .delete()

                    .eq(
                        "id",
                        studentId
                    );


                if (error) {

                    console.error(
                        "Delete student error:",
                        error
                    );


                    alert(
                        "Unable to delete this student."
                    );


                    return;

                }


                student.remove();


                alert(
                    "Student deleted successfully."
                );

            }

            catch (error) {

                console.error(
                    "Delete student error:",
                    error
                );


                alert(
                    "An error occurred while deleting the student."
                );

            }

        }



        /* =========================================
           START
        ========================================= */

        loadStudents();

    </script>


</body>

</html>
