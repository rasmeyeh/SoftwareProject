<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Company Profile - Internship Management System</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

    <style>

        /* =========================================
           COMPANY LOGO UPLOAD
        ========================================== */

        .company-logo-upload {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
            position: relative;
        }

        .company-logo-upload img {
            cursor: pointer;
            transition: 0.2s ease;
        }

        .company-logo-upload:hover img {
            opacity: 0.75;
        }

    </style>

</head>


<body>


    <!-- =========================================
         COMPANY PROFILE PAGE
    ========================================== -->

    <div class="home-page">


        <!-- =====================================
             NAVBAR
        ====================================== -->

        <header class="navbar">

            <div class="nav-content">


                <!-- LOGO -->

                <a
                    href="company-dashboard.html"
                    class="brand"
                >

                    <img
                        src="./images/logo.png"
                        alt="Internship Management System Logo"
                    >

                    <span>
                        Internship Management System
                    </span>

                </a>



                <!-- NAVIGATION -->

                <nav class="nav-links">

                    <a href="company-dashboard.html">
                        Dashboard
                    </a>


                    <a href="company-posts.html">
                        My Posts
                    </a>


                    <a href="applicants.html">
                        Applicants
                    </a>


                    <a
                        href="company-profile.html"
                        class="active"
                    >
                        Profile
                    </a>


                    <a
                        href="index.html"
                        class="logout"
                        id="logoutLink"
                    >
                        Logout
                    </a>

                </nav>

            </div>

        </header>



        <!-- =====================================
             MAIN CONTENT
        ====================================== -->

        <main class="company-profile-page">


            <!-- =================================
                 PAGE HEADER
            ================================== -->

            <section class="company-profile-header">

                <div>

                    <span class="dashboard-label">
                        COMPANY PROFILE
                    </span>

                    <h1>
                        Company Information
                    </h1>

                    <p>
                        Manage your company information
                        and contact details.
                    </p>

                </div>

            </section>



            <!-- =================================
                 PROFILE CARD
            ================================== -->

            <section class="company-profile-card">


                <!-- =================================
                     COMPANY LOGO
                ================================== -->

                <div class="profile-logo-section">


                    <div class="profile-company-logo">

                        <label
                            for="logoInput"
                            class="company-logo-upload"
                            title="Click to change company logo"
                        >

                            <img
                                id="companyLogo"
                                src="./images/logo.png"
                                alt="Company Logo"
                            >


                            <input
                                type="file"
                                id="logoInput"
                                accept="image/png,image/jpeg,image/webp"
                                hidden
                            >

                        </label>

                    </div>


                    <div>

                        <h2 id="companyTitle">
                            Loading...
                        </h2>

                        <p id="companyField">
                            Loading...
                        </p>

                    </div>

                </div>



                <!-- =================================
                     COMPANY INFORMATION
                ================================== -->

                <div class="profile-information">


                    <!-- COMPANY NAME -->

                    <div class="profile-field">

                        <label for="companyName">
                            Company Name
                        </label>

                        <input
                            type="text"
                            id="companyName"
                            placeholder="Company Name"
                        >

                    </div>



                    <!-- EMAIL -->

                    <div class="profile-field">

                        <label for="companyEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="companyEmail"
                            placeholder="Company Email"
                        >

                    </div>



                    <!-- PHONE -->

                    <div class="profile-field">

                        <label for="companyPhone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="companyPhone"
                            placeholder="Phone Number"
                        >

                    </div>



                    <!-- CITY -->

                    <div class="profile-field">

                        <label for="companyCity">
                            City
                        </label>

                        <select id="companyCity">

                            <option value="">
                                Select City
                            </option>

                            <option value="Ramallah">
                                Ramallah
                            </option>

                            <option value="Nablus">
                                Nablus
                            </option>

                            <option value="Hebron">
                                Hebron
                            </option>

                            <option value="Bethlehem">
                                Bethlehem
                            </option>

                            <option value="Jerusalem">
                                Jerusalem
                            </option>

                        </select>

                    </div>



                    <!-- WEBSITE -->

                    <div class="profile-field full-width">

                        <label for="companyWebsite">
                            Website
                        </label>

                        <input
                            type="text"
                            id="companyWebsite"
                            placeholder="Company Website"
                        >

                    </div>



                    <!-- DESCRIPTION -->

                    <div class="profile-field full-width">

                        <label for="companyDescription">
                            Company Description
                        </label>

                        <textarea
                            id="companyDescription"
                            rows="5"
                            placeholder="Company Description"
                        ></textarea>

                    </div>

                </div>



                <!-- =================================
                     SAVE MESSAGE
                ================================== -->

                <p
                    id="saveMessage"
                    class="error-message"
                    style="text-align: center; margin-top: 20px;"
                ></p>



                <!-- =================================
                     BUTTONS
                ================================== -->

                <div class="profile-actions">

                    <a
                        href="company-dashboard.html"
                        class="profile-cancel-button"
                    >
                        Cancel
                    </a>


                    <button
                        type="button"
                        class="profile-save-button"
                        id="saveButton"
                    >
                        Save Changes
                    </button>

                </div>


            </section>


        </main>



        <!-- =====================================
             FOOTER
        ====================================== -->

        <footer class="home-footer">

            <p>
                © 2026 Internship Management System
            </p>

        </footer>


    </div>



    <!-- =========================================
         SUPABASE
    ========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="./js/supabase.js"></script>



    <script>


        /* =========================================
           GET ELEMENTS
        ========================================== */

        const companyName =
            document.getElementById("companyName");


        const companyEmail =
            document.getElementById("companyEmail");


        const companyPhone =
            document.getElementById("companyPhone");


        const companyCity =
            document.getElementById("companyCity");


        const companyWebsite =
            document.getElementById("companyWebsite");


        const companyDescription =
            document.getElementById("companyDescription");


        const companyTitle =
            document.getElementById("companyTitle");


        const companyField =
            document.getElementById("companyField");


        const companyLogo =
            document.getElementById("companyLogo");


        const logoInput =
            document.getElementById("logoInput");


        const saveButton =
            document.getElementById("saveButton");


        const saveMessage =
            document.getElementById("saveMessage");



        /* =========================================
           STORE ORIGINAL DATA
        ========================================== */

        let originalData = {

            name: "",

            email: "",

            phone: "",

            city: "",

            website: "",

            description: ""

        };



        /* =========================================
           LOAD COMPANY PROFILE
        ========================================== */

        async function loadCompanyProfile() {

            saveMessage.textContent = "";


            try {


                /* =========================
                   GET LOGGED-IN USER
                ========================= */

                const {
                    data: {
                        user
                    },
                    error: userError
                } = await db.auth.getUser();


                if (
                    userError ||
                    !user
                ) {

                    window.location.href =
                        "index.html";

                    return;

                }



                /* =========================
                   GET COMPANY
                ========================= */

                const {
                    data: company,
                    error: companyError
                } = await db
                    .from("companies")
                    .select(`
                        id,
                        profile_id,
                        name,
                        email,
                        phone,
                        city,
                        field,
                        website,
                        logo_url,
                        description
                    `)
                    .eq(
                        "profile_id",
                        user.id
                    )
                    .maybeSingle();



                /* =========================
                   COMPANY ERROR
                ========================= */

                if (companyError) {

                    console.error(
                        companyError
                    );

                    saveMessage.style.color =
                        "#b00020";

                    saveMessage.textContent =
                        "Unable to load company information.";

                    return;

                }



                /* =========================
                   COMPANY NOT FOUND
                ========================= */

                if (!company) {

                    saveMessage.style.color =
                        "#b00020";

                    saveMessage.textContent =
                        "Company profile was not found.";

                    return;

                }



                /* =========================
                   DISPLAY DATA
                ========================= */

                companyName.value =
                    company.name || "";


                companyEmail.value =
                    company.email || "";


                companyPhone.value =
                    company.phone || "";


                companyCity.value =
                    company.city || "";


                companyWebsite.value =
                    company.website || "";


                companyDescription.value =
                    company.description || "";



                /* =========================
                   STORE ORIGINAL DATA
                ========================= */

                originalData = {

                    name:
                        company.name || "",

                    email:
                        company.email || "",

                    phone:
                        company.phone || "",

                    city:
                        company.city || "",

                    website:
                        company.website || "",

                    description:
                        company.description || ""

                };



                /* =========================
                   HEADER
                ========================= */

                companyTitle.textContent =
                    company.name || "Company";


                companyField.textContent =
                    company.field || "Technology";



                /* =========================
                   LOGO
                ========================= */

                if (company.logo_url) {

                    /*
                     * Add timestamp to prevent
                     * browser cache from showing
                     * the old company logo.
                     */

                    companyLogo.src =
                        company.logo_url +
                        "?t=" +
                        Date.now();

                }

            }


            catch (error) {

                console.error(
                    error
                );

                saveMessage.style.color =
                    "#b00020";

                saveMessage.textContent =
                    "Something went wrong while loading your profile.";

            }

        }



        /* =========================================
           COMPANY LOGO UPLOAD
        ========================================== */

        logoInput.addEventListener(
            "change",
            async function () {


                const file =
                    logoInput.files[0];


                if (!file) {
                    return;
                }



                /* =========================
                   CHECK FILE TYPE
                ========================= */

                const allowedTypes = [

                    "image/png",

                    "image/jpeg",

                    "image/webp"

                ];


                if (
                    !allowedTypes.includes(
                        file.type
                    )
                ) {

                    saveMessage.style.color =
                        "#b00020";

                    saveMessage.textContent =
                        "Please select a PNG, JPG, or WEBP image.";

                    logoInput.value = "";

                    return;

                }



                /* =========================
                   CHECK FILE SIZE
                ========================= */

                if (
                    file.size >
                    5 * 1024 * 1024
                ) {

                    saveMessage.style.color =
                        "#b00020";

                    saveMessage.textContent =
                        "Image size must be less than 5 MB.";

                    logoInput.value = "";

                    return;

                }



                try {


                    saveMessage.style.color =
                        "#315B66";

                    saveMessage.textContent =
                        "Uploading logo...";



                    /* =========================
                       GET USER
                    ========================= */

                    const {
                        data: {
                            user
                        },
                        error: userError
                    } = await db.auth.getUser();


                    if (
                        userError ||
                        !user
                    ) {

                        throw new Error(
                            "Your session has expired. Please login again."
                        );

                    }



                    /* =========================
                       GET COMPANY
                    ========================= */

                    const {
                        data: company,
                        error: companyError
                    } = await db
                        .from("companies")
                        .select(
                            "id, logo_url"
                        )
                        .eq(
                            "profile_id",
                            user.id
                        )
                        .single();


                    if (companyError) {
                        throw companyError;
                    }



                    /* =========================
                       FILE EXTENSION
                    ========================= */

                    const fileExtension =
                        file.name
                            .split(".")
                            .pop()
                            .toLowerCase();



                    /* =========================
                       FILE PATH
                    ========================= */

                    const fileName =
                        `${company.id}.${fileExtension}`;


                    const filePath =
                        `${company.id}/${fileName}`;



                    /* =========================
                       UPLOAD TO STORAGE
                    ========================= */

                    const {
                        error: uploadError
                    } = await db.storage
                        .from("company-logos")
                        .upload(
                            filePath,
                            file,
                            {
                                upsert: true,
                                contentType:
                                    file.type
                            }
                        );


                    if (uploadError) {
                        throw uploadError;
                    }



                    /* =========================
                       GET PUBLIC URL
                    ========================= */

                    const {
                        data: publicUrlData
                    } = db.storage
                        .from("company-logos")
                        .getPublicUrl(
                            filePath
                        );


                    const logoUrl =
                        publicUrlData.publicUrl;



                    /* =========================
                       SAVE URL IN DATABASE
                    ========================= */

                    const {
                        error: updateError
                    } = await db
                        .from("companies")
                        .update({

                            logo_url:
                                logoUrl

                        })
                        .eq(
                            "id",
                            company.id
                        );


                    if (updateError) {
                        throw updateError;
                    }



                    /* =========================
                       DISPLAY NEW LOGO
                    ========================= */

                    /*
                     * Add a timestamp so the browser
                     * loads the new image instead of
                     * using the cached old image.
                     */

                    companyLogo.src =
                        logoUrl +
                        "?t=" +
                        Date.now();



                    saveMessage.style.color =
                        "#315B66";

                    saveMessage.textContent =
                        "Company logo updated successfully.";


                    logoInput.value = "";

                }


                catch (error) {

                    console.error(
                        "Logo upload error:",
                        error
                    );


                    saveMessage.style.color =
                        "#b00020";

                    saveMessage.textContent =
                        "Unable to upload company logo. " +
                        error.message;


                    logoInput.value = "";

                }

            }
        );



        /* =========================================
           SAVE COMPANY PROFILE
        ========================================== */

        saveButton.addEventListener(
            "click",
            async function () {


                saveMessage.textContent = "";



                /* =========================
                   GET CURRENT VALUES
                ========================= */

                const currentData = {

                    name:
                        companyName.value.trim(),

                    email:
                        companyEmail.value.trim(),

                    phone:
                        companyPhone.value.trim(),

                    city:
                        companyCity.value,

                    website:
                        companyWebsite.value.trim(),

                    description:
                        companyDescription.value.trim()

                };



                /* =========================
                   CHECK CHANGES
                ========================================== */

                const hasChanges =

                    currentData.name !==
                    originalData.name ||

                    currentData.email !==
                    originalData.email ||

                    currentData.phone !==
                    originalData.phone ||

                    currentData.city !==
                    originalData.city ||

                    currentData.website !==
                    originalData.website ||

                    currentData.description !==
                    originalData.description;



                /* =========================
                   NO CHANGES
                ========================================== */

                if (!hasChanges) {

                    saveMessage.style.color =
                        "#315B66";

                    saveMessage.textContent =
                        "No changes to save.";

                    return;

                }



                /* =========================
                   START SAVING
                ========================================== */

                saveButton.disabled =
                    true;


                saveButton.textContent =
                    "Saving...";


                try {


                    /* =========================
                       GET USER
                    ========================================== */

                    const {
                        data: {
                            user
                        },
                        error: userError
                    } = await db.auth.getUser();


                    if (
                        userError ||
                        !user
                    ) {

                        saveMessage.style.color =
                            "#b00020";

                        saveMessage.textContent =
                            "Your session has expired. Please login again.";

                        saveButton.disabled =
                            false;

                        saveButton.textContent =
                            "Save Changes";

                        return;

                    }



                    /* =========================
                       UPDATE DATABASE
                    ========================= */

                    const {
                        error: updateError
                    } = await db
                        .from("companies")
                        .update({

                            name:
                                currentData.name,

                            email:
                                currentData.email ||
                                null,

                            phone:
                                currentData.phone ||
                                null,

                            city:
                                currentData.city ||
                                null,

                            website:
                                currentData.website ||
                                null,

                            description:
                                currentData.description ||
                                null

                        })
                        .eq(
                            "profile_id",
                            user.id
                        );



                    /* =========================
                       UPDATE ERROR
                    ========================= */

                    if (updateError) {

                        console.error(
                            updateError
                        );

                        saveMessage.style.color =
                            "#b00020";

                        saveMessage.textContent =
                            "Unable to save changes. Please try again.";

                        saveButton.disabled =
                            false;

                        saveButton.textContent =
                            "Save Changes";

                        return;

                    }



                    /* =========================
                       UPDATE ORIGINAL DATA
                    ========================= */

                    originalData = {

                        ...currentData

                    };



                    /* =========================
                       UPDATE HEADER
                    ========================= */

                    companyTitle.textContent =
                        currentData.name ||
                        "Company";



                    /* =========================
                       SUCCESS
                    ========================================== */

                    saveMessage.style.color =
                        "#315B66";

                    saveMessage.textContent =
                        "Changes saved successfully!";


                    saveButton.disabled =
                        false;


                    saveButton.textContent =
                        "Save Changes";

                }


                catch (error) {

                    console.error(
                        error
                    );

                    saveMessage.style.color =
                        "#b00020";

                    saveMessage.textContent =
                        "Something went wrong. Please try again.";

                    saveButton.disabled =
                        false;

                    saveButton.textContent =
                        "Save Changes";

                }

            }
        );



        /* =========================================
           LOGOUT
        ========================================== */

        document
            .getElementById("logoutLink")
            .addEventListener(
                "click",
                async function (event) {

                    event.preventDefault();


                    await db.auth.signOut();


                    localStorage.removeItem(
                        "username"
                    );


                    localStorage.removeItem(
                        "role"
                    );


                    window.location.href =
                        "index.html";

                }
            );



        /* =========================================
           LOAD PROFILE
        ========================================== */

        loadCompanyProfile();

    </script>


</body>

</html>
