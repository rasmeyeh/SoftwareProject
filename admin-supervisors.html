<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manage Supervisors</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="nav-content">


            <!-- LOGO -->

            <a
                href="admin-dashboard.html"
                class="brand"
            >
<img
    src="./images/alquds-university-logo.png"
    alt="Al-Quds University Logo"
    class="university-navbar-logo"
>
                <img
                    src="./images/logo.png"
                    alt="PathLink Logo"
                >

                <span>
                    PathLink
                </span>

            </a>


            <!-- NAVIGATION -->

            <nav class="nav-links">

                <a href="admin-dashboard.html">
                    Dashboard
                </a>

                <a
                    href="admin-supervisors.html"
                    class="active"
                >
                    Supervisors
                </a>

                <a href="admin-profile.html">
                    Profile
                </a>

                <a
                    href="index.html"
                    class="logout"
                >
                    Logout
                </a>

            </nav>

        </div>

    </header>



    <!-- ================= SUPERVISORS PAGE ================= -->

    <main class="admin-supervisors-page">


        <a
            href="admin-dashboard.html"
            class="admin-back"
        >
            ← Back to Dashboard
        </a>



        <!-- ================= PAGE HEADER ================= -->

        <section class="admin-supervisor-header">

            <p class="admin-section-label">
                ADMINISTRATION
            </p>

            <h1>
                Manage Supervisors
            </h1>

            <p>
                View and manage university supervisor accounts.
            </p>

        </section>



        <!-- ================= SUPERVISORS CARD ================= -->

        <section class="admin-supervisors-card">


            <!-- ================= TOOLBAR ================= -->

            <div class="admin-supervisors-toolbar">


                <div class="admin-supervisor-search">

                    <input
                        type="text"
                        id="supervisorSearch"
                        placeholder="Search supervisors..."
                    >

                </div>


            </div>



            <!-- ================= SUPERVISORS LIST ================= -->

            <div
                class="admin-supervisor-list"
                id="supervisorsList"
            >

                <div class="admin-supervisor-item">

                    <div class="admin-supervisor-info">

                        <h3>
                            Loading supervisors...
                        </h3>

                        <p>
                            Please wait
                        </p>

                    </div>

                </div>

            </div>


        </section>


    </main>


    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="home-footer">

        <p>
            © 2026 PathLink
        </p>

    </footer>

</div>

    <!-- ================= SUPABASE ================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="./js/supabase.js"></script>



    <!-- ================= JAVASCRIPT ================= -->

    <script>


        /* =========================================
           ELEMENTS
        ========================================= */

        const supervisorSearch =
            document.getElementById(
                "supervisorSearch"
            );


        const supervisorsList =
            document.getElementById(
                "supervisorsList"
            );



        /* =========================================
           LOAD SUPERVISORS
        ========================================= */

        async function loadSupervisors() {

            try {


                /* =========================================
                   GET SUPERVISOR PROFILES
                ========================================= */

                const {
                    data: profiles,
                    error: profilesError
                } = await db

                    .from("profiles")

                    .select(
                        "id, full_name, username, email, role"
                    )

                    .eq(
                        "role",
                        "supervisor"
                    )

                    .order(
                        "full_name",
                        {
                            ascending: true
                        }
                    );


                /* =========================================
                   PROFILE ERROR
                ========================================= */

                if (profilesError) {

                    console.error(
                        "Supervisors loading error:",
                        profilesError
                    );


                    supervisorsList.innerHTML = `

                        <div class="admin-supervisor-item">

                            <div class="admin-supervisor-info">

                                <h3>
                                    Unable to load supervisors
                                </h3>

                                <p>
                                    Please try again.
                                </p>

                            </div>

                        </div>

                    `;

                    return;

                }



                /* =========================================
                   NO SUPERVISORS
                ========================================= */

                if (
                    !profiles ||
                    profiles.length === 0
                ) {

                    supervisorsList.innerHTML = `

                        <div class="admin-supervisor-item">

                            <div class="admin-supervisor-info">

                                <h3>
                                    No supervisors found
                                </h3>

                                <p>
                                    No registered university supervisors are available.
                                </p>

                            </div>

                        </div>

                    `;

                    return;

                }



                /* =========================================
                   GET SUPERVISOR DETAILS
                ========================================= */

                const supervisorIds =
                    profiles.map(
                        profile => profile.id
                    );


                const {
                    data: supervisorDetails,
                    error: supervisorsError
                } = await db

                    .from("supervisors")

                    .select("*")

                    .in(
                        "id",
                        supervisorIds
                    );


                if (supervisorsError) {

                    console.error(
                        "Supervisor details error:",
                        supervisorsError
                    );

                }



                /* =========================================
                   GET STUDENTS
                ========================================= */

                const {
                    data: students,
                    error: studentsError
                } = await db

                    .from("students")

                    .select(
                        "id, supervisor_id"
                    );


                if (studentsError) {

                    console.error(
                        "Students loading error:",
                        studentsError
                    );

                }



                /* =========================================
                   CLEAR LIST
                ========================================= */

                supervisorsList.innerHTML = "";



                /* =========================================
                   CREATE SUPERVISOR ITEMS
                ========================================= */

                profiles.forEach(
                    function (profile) {


                        /* =========================================
                           DETAILS
                        ========================================= */

                        const details =
                            supervisorDetails?.find(
                                supervisor =>
                                    supervisor.id ===
                                    profile.id
                            );



                        /* =========================================
                           NAME
                        ========================================= */

                        const name =
                            profile.full_name ||
                            profile.username ||
                            "Supervisor";



                        /* =========================================
                           EMAIL
                        ========================================= */

                        const email =
                            profile.email ||
                            "No email";



                        /* =========================================
                           SPECIALIZATION
                        ========================================= */

                        const specialization =
                            details?.specialization ||
                            details?.department ||
                            details?.field ||
                            "University Supervisor";



                        /* =========================================
                           STUDENT COUNT
                        ========================================= */

                        const studentCount =
                            students?.filter(
                                student =>
                                    student.supervisor_id ===
                                    profile.id
                            ).length || 0;



                        /* =========================================
                           INITIALS
                        ========================================= */

                        const initials =
                            name
                                .split(" ")
                                .filter(Boolean)
                                .slice(0, 2)
                                .map(
                                    word =>
                                        word
                                            .charAt(0)
                                            .toUpperCase()
                                )
                                .join("");



                        /* =========================================
                           CREATE ITEM
                        ========================================= */

                        const supervisorItem =
                            document.createElement(
                                "div"
                            );


                        supervisorItem.className =
                            "admin-supervisor-item";


                        supervisorItem.dataset.id =
                            profile.id;



                        supervisorItem.innerHTML = `

                            <div class="admin-supervisor-avatar">
                                ${escapeHtml(initials)}
                            </div>


                            <div class="admin-supervisor-info">

                                <h3>
                                    ${escapeHtml(name)}
                                </h3>

                                <p>
                                    ${escapeHtml(specialization)}
                                </p>

                                <span>
                                    ${escapeHtml(email)}
                                </span>

                            </div>


                            <div class="admin-supervisor-students">

                                <strong>
                                    ${studentCount}
                                </strong>

                                <span>
                                    Students
                                </span>

                            </div>


                            <div class="admin-supervisor-actions">

                                <a
                                    href="admin-supervisor-view.html?id=${encodeURIComponent(profile.id)}"
                                    class="admin-supervisor-view"
                                >
                                    View
                                </a>


                                <button
                                    type="button"
                                    class="admin-supervisor-delete"
                                    onclick="deleteSupervisor(this, '${profile.id}')"
                                >
                                    Delete
                                </button>

                            </div>

                        `;


                        supervisorsList.appendChild(
                            supervisorItem
                        );

                    }
                );


                filterSupervisors();


            }

            catch (error) {

                console.error(
                    "Supervisors error:",
                    error
                );


                supervisorsList.innerHTML = `

                    <div class="admin-supervisor-item">

                        <div class="admin-supervisor-info">

                            <h3>
                                Unable to load supervisors
                            </h3>

                            <p>
                                An unexpected error occurred.
                            </p>

                        </div>

                    </div>

                `;

            }

        }



        /* =========================================
           ESCAPE HTML
        ========================================= */

        function escapeHtml(value) {

            if (!value) {
                return "";
            }


            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }



        /* =========================================
           FILTER SUPERVISORS
        ========================================= */

        function filterSupervisors() {

            const searchValue =
                supervisorSearch.value
                    .toLowerCase()
                    .trim();


            const supervisors =
                document.querySelectorAll(
                    ".admin-supervisor-item"
                );


            supervisors.forEach(
                function (supervisor) {


                    const nameElement =
                        supervisor.querySelector(
                            ".admin-supervisor-info h3"
                        );


                    const specializationElement =
                        supervisor.querySelector(
                            ".admin-supervisor-info p"
                        );


                    const emailElement =
                        supervisor.querySelector(
                            ".admin-supervisor-info span"
                        );


                    const name =
                        nameElement
                            ? nameElement.textContent
                                .toLowerCase()
                            : "";


                    const specialization =
                        specializationElement
                            ? specializationElement.textContent
                                .toLowerCase()
                            : "";


                    const email =
                        emailElement
                            ? emailElement.textContent
                                .toLowerCase()
                            : "";



                    /* =========================================
                       SEARCH
                    ========================================= */

                    const matchesSearch =
                        name.includes(searchValue) ||
                        specialization.includes(searchValue) ||
                        email.includes(searchValue);



                    /* =========================================
                       DISPLAY
                    ========================================= */

                    if (
                        matchesSearch
                    ) {

                        supervisor.style.display =
                            "flex";

                    }

                    else {

                        supervisor.style.display =
                            "none";

                    }

                }
            );

        }



        /* =========================================
           SEARCH EVENT
        ========================================= */

        supervisorSearch.addEventListener(
            "input",
            filterSupervisors
        );



        /* =========================================
           DELETE SUPERVISOR
        ========================================= */

        async function deleteSupervisor(
            button,
            supervisorId
        ) {


            const supervisor =
                button.closest(
                    ".admin-supervisor-item"
                );


            if (!supervisor) {
                return;
            }



            const supervisorName =
                supervisor
                    .querySelector(
                        ".admin-supervisor-info h3"
                    )
                    .textContent;



            /* =========================================
               CHECK ASSIGNED STUDENTS
            ========================================= */

            const {
                data: assignedStudents,
                error: studentsError
            } = await db

                .from("students")

                .select("id")

                .eq(
                    "supervisor_id",
                    supervisorId
                );


            if (studentsError) {

                console.error(
                    "Supervisor students error:",
                    studentsError
                );


                alert(
                    "Unable to check this supervisor's students."
                );

                return;

            }



            /* =========================================
               PREVENT ACCIDENTAL DELETE
            ========================================= */

            if (
                assignedStudents &&
                assignedStudents.length > 0
            ) {

                alert(
                    "This supervisor cannot be deleted because " +
                    assignedStudents.length +
                    " student(s) are assigned to this supervisor."
                );

                return;

            }



            /* =========================================
               CONFIRM DELETE
            ========================================= */

            const confirmed =
                confirm(
                    "Are you sure you want to delete " +
                    supervisorName +
                    "?"
                );


            if (!confirmed) {
                return;
            }



            try {


                /* =========================================
                   DELETE SUPERVISOR RECORD ONLY
                ========================================= */

                const {
                    error
                } = await db

                    .from("supervisors")

                    .delete()

                    .eq(
                        "id",
                        supervisorId
                    );


                if (error) {

                    console.error(
                        "Delete supervisor error:",
                        error
                    );


                    alert(
                        "Unable to delete this supervisor."
                    );

                    return;

                }



                /* =========================================
                   REMOVE FROM PAGE
                ========================================= */

                supervisor.remove();


                alert(
                    "Supervisor deleted successfully."
                );


            }

            catch (error) {

                console.error(
                    "Delete supervisor error:",
                    error
                );


                alert(
                    "An error occurred while deleting the supervisor."
                );

            }

        }



        /* =========================================
           START
        ========================================= */

        loadSupervisors();

    </script>


</body>

</html>
