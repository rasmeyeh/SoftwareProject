
<!DOCTYPE html>
<html lang="en">

    >

    <title>Post Internship</title>

    >

</head>


<body>

    <div class="home-page">


        <!-- =========================================
             NAVBAR
        ========================================== -->

        <header class="navbar">

            <div class="nav-content">


                <!-- LOGO -->

                <a
                    href="company-dashboard.html"
                    class="brand"
                >

                    <img

                        alt="Al-Quds University Logo"
                        class="university-navbar-logo"
                    >

                    <img
                        src="./images/logo.png"
                        alt="PathLink Logo"
                    >

                    <span>
                        PathLink
                    </span>

                </a>


                <!-- NAVIGATION -->

                <nav class="nav-links">

                    <a href="company-dashboard.html">
                        Dashboard
                    </a>

                    <a
                        href="company-posts.html"
                        class="active"
                    >
                        My Posts
                    </a>

                    <a href="applicants.html">
                        Applicants
                    </a>

                    <a href="company-profile.html">
                        Profile
                    </a>

                    <a
                        href="index.html"
                        class="logout"
                    >
                        Logout
                    </a>

                </nav>

            </div>

        </header>



        <!-- =========================================
             POST INTERNSHIP
        ========================================== -->

        <main class="post-internship-page">

            <a
                href="company-posts.html"
                class="back-to-posts"
                id="back-to-posts"
            >
                ← Back to My Posts
            </a>


            <!-- PAGE HEADER -->

            <div class="post-header">

                <span class="dashboard-label">
                    INTERNSHIP OPPORTUNITY
                </span>

                <h1>
                    Post a New Internship
                </h1>

                <p>
                    Create an internship opportunity
                    for students to discover and apply.
                </p>

            </div>



            <!-- =====================================
                 FORM CARD
            ====================================== -->

            <section class="post-card">


                <!-- BASIC INFORMATION -->

                <div class="post-section">

                    <h2>
                        Basic Information
                    </h2>


                    <div class="post-grid">


                        <!-- TITLE -->

                        <div class="post-field full-width">

                            <label for="internship-title">
                                Internship Title
                            </label>

                            <input
                                type="text"
                                id="internship-title"
                                placeholder="e.g. Software Engineering Intern"
                            >

                        </div>



                        <!-- FIELD -->

                        <div class="post-field">

                            <label for="internship-field">
                                Field / Category
                            </label>

                            <select id="internship-field">

                                <option value="">
                                    Select a field
                                </option>

                                <option value="Web Development">
                                    Web Development
                                </option>

                                <option value="Systems Administration">
                                    Systems Administration
                                </option>

                                <option value="Software & IT">
                                    Software & IT
                                </option>

                                <option value="Telecommunications & IT">
                                    Telecommunications & IT
                                </option>

                                <option value="Software Testing">
                                    Software Testing
                                </option>

                                <option value="Mobile App Development">
                                    Mobile App Development
                                </option>

                                <option value="Networking">
                                    Networking
                                </option>

                                <option value="Software Engineering">
                                    Software Engineering
                                </option>

                                <option value="Software Development">
                                    Software Development
                                </option>

                                <option value="UI/UX Design">
                                    UI/UX Design
                                </option>

                                <option value="IT Support">
                                    IT Support
                                </option>

                                <option value="Telecommunications & Networking">
                                    Telecommunications & Networking
                                </option>

                                <option value="IT & Technology">
                                    IT & Technology
                                </option>

                                <option value="IT & Telecommunications">
                                    IT & Telecommunications
                                </option>

                                <option value="IT Security">
                                    IT Security
                                </option>

                            </select>

                        </div>



                        <!-- LOCATION -->

                        <div class="post-field">

                            <label for="internship-location">
                                Location
                            </label>

                            <input
                                type="text"
                                id="internship-location"
                                placeholder="e.g. Ramallah"
                            >

                        </div>



                        <!-- NUMBER OF STUDENTS REQUIRED -->

                        <div class="post-field">

                            <label for="students-required">
                                Number of Students Required
                            </label>

                            <input
                                type="number"
                                id="students-required"
                                min="1"
                                step="1"
                                placeholder="e.g. 3"
                                required
                            >

                        </div>


                    </div>

                </div>



                <!-- =====================================
                     DESCRIPTION
                ====================================== -->

                <div class="post-section">

                    <h2>
                        Internship Details
                    </h2>


                    <div class="post-field">

                        <label for="internship-description">
                            Description
                        </label>

                        <textarea
                            id="internship-description"
                            placeholder="Describe the internship opportunity..."
                        ></textarea>

                    </div>


                    <div class="post-field">

                        <label for="internship-requirements">
                            Requirements
                        </label>

                        <textarea
                            id="internship-requirements"
                            placeholder="List the skills, qualifications, or requirements..."
                        ></textarea>

                    </div>

                </div>



                <!-- =====================================
                     APPLICATION PERIOD
                ====================================== -->

                <div class="post-section">

                    <h2>
                        Application Period
                    </h2>


                    <div class="post-grid">


                        <!-- APPLICATION START DATE -->

                        <div class="post-field">

                            <label for="application-start-date">
                                Application Start Date
                            </label>

                            <input
                                type="date"
                                id="application-start-date"
                                required
                            >

                        </div>



                        <!-- APPLICATION END DATE -->

                        <div class="post-field">

                            <label for="application-end-date">
                                Application End Date
                            </label>

                            <input
                                type="date"
                                id="application-end-date"
                                required
                            >

                        </div>


                    </div>

                </div>



                <!-- =====================================
                     INTERNSHIP PERIOD
                ====================================== -->

                <div class="post-section">

                    <h2>
                        Internship Period
                    </h2>


                    <div class="post-grid">


                        <!-- INTERNSHIP START DATE -->

                        <div class="post-field">

                            <label for="start-date">
                                Internship Start Date
                            </label>

                            <input
                                type="date"
                                id="start-date"
                                required
                            >

                        </div>



                        <!-- INTERNSHIP END DATE -->

                        <div class="post-field">

                            <label for="end-date">
                                Internship End Date
                            </label>

                            <input
                                type="date"
                                id="end-date"
                                required
                            >

                        </div>


                    </div>

                </div>



                <!-- =====================================
                     ACTIONS
                ====================================== -->

                <div class="post-actions">

                    <a
                        href="company-dashboard.html"
                        class="cancel-post-button"
                    >
                        Cancel
                    </a>


                    <button
                        type="button"
                        class="publish-button"
                        id="submit-internship"
                    >
                        Publish Internship
                    </button>

                </div>


            </section>


        </main>



        <!-- =========================================
             FOOTER
        ========================================== -->

        <footer class="home-footer">

            <p>
                ©️ 2026 PathLink
            </p>

        </footer>


    </div>



    <!-- =========================================
         SUPABASE
    ========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="./js/supabase.js"></script>



    <!-- =========================================
         PAGE SCRIPT
    ========================================== -->

    <script>


        const params =
            new URLSearchParams(
                window.location.search
            );


        const editId =
            params.get("edit");



        const titleInput =
            document.getElementById(
                "internship-title"
            );


        const fieldInput =
            document.getElementById(
                "internship-field"
            );


        const locationInput =
            document.getElementById(
                "internship-location"
            );


        const studentsRequiredInput =
            document.getElementById(
                "students-required"
            );


        const descriptionInput =
            document.getElementById(
                "internship-description"
            );


        const requirementsInput =
            document.getElementById(
                "internship-requirements"
            );


        // APPLICATION PERIOD

        const applicationStartDateInput =
            document.getElementById(
                "application-start-date"
            );


        const applicationEndDateInput =
            document.getElementById(
                "application-end-date"
            );


        // INTERNSHIP PERIOD

        const startDateInput =
            document.getElementById(
                "start-date"
            );


        const endDateInput =
            document.getElementById(
                "end-date"
            );


        const submitButton =
            document.getElementById(
                "submit-internship"
            );


        const backToPostsButton =
            document.getElementById(
                "back-to-posts"
            );



        /* =========================================
           GET CURRENT COMPANY
        ========================================== */

        async function getCurrentCompany() {

            const {
                data: {
                    user
                },
                error: userError
            } = await db.auth.getUser();


            if (userError) {

                throw userError;

            }


            if (!user) {

                throw new Error(
                    "You are not logged in."
                );

            }


            const {
                data: company,
                error: companyError
            } = await db
                .from("companies")
                .select("*")
                .eq(
                    "profile_id",
                    user.id
                )
                .single();


            if (companyError) {

                throw companyError;

            }


            return company;

        }



        /* =========================================
           CALCULATE INTERNSHIP STATUS
           BASED ON APPLICATION PERIOD
        ========================================== */

        function calculateInternshipStatus(
            applicationStartDate,
            applicationEndDate
        ) {

            if (
                !applicationStartDate ||
                !applicationEndDate
            ) {

                return "upcoming";

            }


            const today =
                new Date();


            const todayDate =
                new Date(
                    today.getFullYear(),
                    today.getMonth(),
                    today.getDate()
                );


            const applicationStart =
                new Date(
                    `${applicationStartDate}T00:00:00`
                );


            const applicationEnd =
                new Date(
                    `${applicationEndDate}T00:00:00`
                );


            // UPCOMING

            if (
                todayDate < applicationStart
            ) {

                return "upcoming";

            }


            // ENDED

            if (
                todayDate > applicationEnd
            ) {

                return "ended";

            }


            // ACTIVE

            return "active";

        }



        /* =========================================
           VALIDATE DATES
        ========================================== */
function validateInternshipDates(internshipData) {

    if (
        !internshipData.application_start_date ||
        !internshipData.application_end_date ||
        !internshipData.start_date ||
        !internshipData.end_date
    ) {

        alert("Please enter all four dates.");
        return false;

    }


    // Validate Application Period

    if (
        internshipData.application_end_date <
        internshipData.application_start_date
    ) {

        alert(
            "Application End Date must be after Application Start Date."
        );

        return false;

    }


    // Validate Internship Period

    if (
        internshipData.end_date <
        internshipData.start_date
    ) {

        alert(
            "Internship End Date must be after Internship Start Date."
        );

        return false;

    }


    // Application Period must end before Internship starts

    if (
        internshipData.application_end_date >
        internshipData.start_date
    ) {

        alert(
            "Application End Date must be before or on Internship Start Date."
        );

        return false;

    }


    return true;

}



        /* =========================================
           LOAD INTERNSHIP FOR EDIT
        ========================================== */

        async function loadInternshipForEdit() {

            if (!editId) {

                return;

            }


            if (backToPostsButton) {

                backToPostsButton.style.display =
                    "inline-flex";

            }


            try {

                const company =
                    await getCurrentCompany();


                const {
                    data: internship,
                    error
                } = await db
                    .from("internships")
                    .select(`
                        id,
                        company_id,
                        title,
                        field,
                        city,
                        students_required,
                        description,
                        requirements,
                        start_date,
                        end_date,
                        application_start_date,
                        application_end_date,
                        status
                    `)
                    .eq(
                        "id",
                        editId
                    )
                    .eq(
                        "company_id",
                        company.id
                    )
                    .single();


                if (error) {

                    throw error;

                }


                if (!internship) {

                    throw new Error(
                        "Internship not found."
                    );

                }



                /* =========================
                   FILL FORM
                ========================= */

                titleInput.value =
                    internship.title || "";


                fieldInput.value =
                    internship.field
                        ? internship.field.trim()
                        : "";


                locationInput.value =
                    internship.city || "";


                studentsRequiredInput.value =
                    internship.students_required ?? "";


                descriptionInput.value =
                    internship.description || "";


                requirementsInput.value =
                    internship.requirements || "";


                // APPLICATION PERIOD

                applicationStartDateInput.value =
                    internship.application_start_date || "";


                applicationEndDateInput.value =
                    internship.application_end_date || "";


                // INTERNSHIP PERIOD

                startDateInput.value =
                    internship.start_date || "";


                endDateInput.value =
                    internship.end_date || "";



                /* =========================
                   CHANGE PAGE TO EDIT MODE
                ========================= */

                const heading =
                    document.querySelector(
                        ".post-header h1"
                    );


                const paragraph =
                    document.querySelector(
                        ".post-header p"
                    );


                if (heading) {

                    heading.textContent =
                        "Edit Internship";

                }


                if (paragraph) {

                    paragraph.textContent =
                        "Update the internship opportunity information.";

                }


                if (submitButton) {

                    submitButton.textContent =
                        "Save Changes";

                }


            } catch (error) {

                console.error(
                    "Load internship error:",
                    error
                );


                alert(
                    "Unable to load internship.\n\n" +
                    error.message
                );

            }

        }



        /* =========================================
           SAVE INTERNSHIP
        ========================================== */

        async function saveInternship() {

            try {

                const company =
                    await getCurrentCompany();


                const internshipData = {

                    title:
                        titleInput.value.trim(),

                    field:
                        fieldInput.value,

                    city:
                        locationInput.value.trim(),

                    students_required:
                        Number(
                            studentsRequiredInput.value
                        ),

                    description:
                        descriptionInput.value.trim(),

                    requirements:
                        requirementsInput.value.trim(),


                    // APPLICATION PERIOD

                    application_start_date:
                        applicationStartDateInput.value || null,

                    application_end_date:
                        applicationEndDateInput.value || null,


                    // INTERNSHIP PERIOD

                    start_date:
                        startDateInput.value || null,

                    end_date:
                        endDateInput.value || null

                };


                /* =========================================
                   VALIDATE ALL FOUR DATES
                ========================================== */

                if (
                    !validateInternshipDates(
                        internshipData
                    )
                ) {

                    return;

                }



                /* =========================================
                   CALCULATE STATUS FROM APPLICATION DATES
                ========================================== */

                const internshipStatus =
                    calculateInternshipStatus(
                        internshipData.application_start_date,
                        internshipData.application_end_date
                    );


console.log("Today's date:", new Date());

console.log(
    "Application Start:",
    internshipData.application_start_date
);

console.log(
    "Application End:",
    internshipData.application_end_date
);

console.log(
    "Calculated Status:",
    internshipStatus
);
                /* =========================
                   EDIT EXISTING INTERNSHIP
                ========================= */

              if (editId) {

    const {
        data: updatedInternship,
        error
    } = await db
        .from("internships")
        .update({

            ...internshipData,

            status: internshipStatus

        })
        .eq(
            "id",
            editId
        )
        .eq(
            "company_id",
            company.id
        )
        .select("id, application_start_date, application_end_date, status")
        .single();


    if (error) {

        throw error;

    }


    console.log(
        "Updated internship:",
        updatedInternship
    );


    alert(
        "Internship updated successfully.\n\n" +
        "New Status: " +
        updatedInternship.status
    );


    window.location.href =
        "company-posts.html";


    return;

}



                /* =========================================
                   CREATE NEW INTERNSHIP
                ========================================== */

                const {
                    error
                } = await db
                    .from("internships")
                    .insert({

                        company_id:
                            company.id,

                        ...internshipData,

                        status:
                            internshipStatus

                    });


                if (error) {

                    throw error;

                }



                /* =========================================
                   CREATE ACTIVITY LOG
                ========================================== */

                const {
                    data: {
                        user
                    }
                } = await db.auth.getUser();


                if (user) {

                    const companyName =
                        company.name ||
                        "Company";


                    const internshipTitle =
                        internshipData.title ||
                        "New Internship";


                    const {
                        error: activityError
                    } = await db
                        .from("activity_logs")
                        .insert({

                            user_id:
                                user.id,

                            activity_type:
                                "internship_posted",

                            title:
                                "Internship Posted",

                            description:
                                `${companyName} posted a new internship opportunity: ${internshipTitle}.`

                        });


                    if (activityError) {

                        console.error(
                            "Activity log error:",
                            activityError
                        );

                    }

                }



                alert(
                    "Internship published successfully."
                );


                window.location.href =
                    "company-posts.html";


            } catch (error) {

                console.error(
                    "Save internship error:",
                    error
                );


                alert(
                    "Unable to save internship.\n\n" +
                    error.message
                );

            }

        }



        /* =========================================
           SUBMIT BUTTON
        ========================================== */

        if (submitButton) {

            submitButton.addEventListener(
                "click",
                saveInternship
            );

        }



        /* =========================================
           LOAD EDIT DATA
        ========================================== */

        loadInternshipForEdit();

    </script>


</body>

</html>
