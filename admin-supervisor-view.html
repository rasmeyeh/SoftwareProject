
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Supervisor Profile</title>

    <link rel="stylesheet" href="./css/style.css">

    <style>
        .cancel-profile-button {
            background: #234B57 !important;
            color: #ffffff !important;
            border: none !important;
        }

        .cancel-profile-button:hover {
            background: #234B57 !important;
        }

        /* VIEW ALL STUDENTS BUTTON */

        .view-all-students-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 4px;
        }

        .view-all-students-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 18px;
            border-radius: 8px;
            background: #234B57;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .view-all-students-button:hover {
            background: #234B57;
        }

        /* STUDENT EVALUATION REPORT BUTTON */

        .student-report-actions {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            margin-left: auto;
        }

        .student-report-button {
            padding: 9px 14px;
            border: none;
            border-radius: 8px;
            background: #234B57;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .student-report-button:hover:not(:disabled) {
            background: #326D7A;
        }

        .student-report-button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .student-report-status {
            color: #9b5a16;
            font-size: 12px;
            text-align: right;
        }

        .student-report-status.ready {
            color: #27623b;
        }

        @media (max-width: 600px) {
            .student-report-actions {
                width: 100%;
                margin-left: 0;
                align-items: flex-start;
            }

            .student-report-status {
                text-align: left;
            }
        }

        /* ASSIGNED STUDENTS HEADER */

        .assigned-students-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 18px;
        }

        .assigned-students-header h2 {
            margin: 0;
        }

        .download-all-students-button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: #234B57;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .download-all-students-button:hover:not(:disabled) {
            background: #326D7A;
        }

        .download-all-students-button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            .assigned-students-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .download-all-students-button {
                width: 100%;
            }
        }
    </style>
</head>

    <!-- ADMIN SUPERVISOR VIEW JAVASCRIPT -->

    <script>

        // =========================================
        // ELEMENTS
        // =========================================

        const profileDisplayName =
            document.getElementById("profileDisplayName");

        const profileAvatar =
            document.getElementById("profileAvatar");

        const profileName =
            document.getElementById("profile-name");

        const profileUsername =
            document.getElementById("profile-username");

        const profileEmail =
            document.getElementById("profile-email");

        const profilePhone =
            document.getElementById("profile-phone");

        const profileDepartment =
            document.getElementById("profile-department");

        const profileSpecialization =
            document.getElementById("profile-specialization");

        const profileStatus =
            document.getElementById("profile-status");

        const profileStudentsCount =
            document.getElementById("profile-students-count");

        const assignedStudentsList =
            document.getElementById("assignedStudentsList");


        // =========================================
        // GET SUPERVISOR ID FROM URL
        // =========================================

        const params =
            new URLSearchParams(window.location.search);

        const supervisorId =
            params.get("id");


        // =========================================
        // LOAD SUPERVISOR
        // =========================================

        async function loadSupervisor() {

            try {

                // CHECK LOGIN

                const {
                    data: { user },
                    error: userError
                } = await db.auth.getUser();

                if (userError || !user) {

                    alert("Please login first.");

                    window.location.href = "index.html";

                    return;
                }


                // CHECK ADMIN

                const {
                    data: adminProfile,
                    error: adminError
                } = await db
                    .from("profiles")
                    .select("id, role")
                    .eq("id", user.id)
                    .maybeSingle();

                if (
                    adminError ||
                    !adminProfile ||
                    adminProfile.role !== "admin"
                ) {

                    alert("Access denied.");

                    window.location.href = "index.html";

                    return;
                }


                // CHECK SUPERVISOR ID

                if (!supervisorId) {

                    alert(
                        "Supervisor information was not specified."
                    );

                    window.location.href =
                        "admin-supervisors.html";

                    return;
                }


                // GET SUPERVISOR PROFILE

                const {
                    data: profile,
                    error: profileError
                } = await db
                    .from("profiles")
                    .select("*")
                    .eq("id", supervisorId)
                    .eq("role", "supervisor")
                    .maybeSingle();

                if (profileError) {

                    console.error(
                        "Profile error:",
                        profileError
                    );

                    alert(
                        "Could not load supervisor profile."
                    );

                    return;
                }

                if (!profile) {

                    alert(
                        "Supervisor profile was not found."
                    );

                    window.location.href =
                        "admin-supervisors.html";

                    return;
                }


                // DISPLAY PERSONAL INFORMATION

                const supervisorName =
                    profile.full_name ||
                    profile.username ||
                    "Supervisor";

                profileDisplayName.textContent =
                    supervisorName;

                profileAvatar.textContent =
                    supervisorName.charAt(0).toUpperCase();

                profileName.value =
                    profile.full_name || "";

                profileUsername.value =
                    profile.username || "";

                profileEmail.value =
                    profile.email || "";

                profilePhone.value =
                    profile.phone || "";


                // GET SUPERVISOR DETAILS

                const {
                    data: supervisor,
                    error: supervisorError
                } = await db
                    .from("supervisors")
                    .select("*")
                    .eq("id", supervisorId)
                    .maybeSingle();

                if (supervisorError) {

                    console.error(
                        "Supervisor details error:",
                        supervisorError
                    );
                }


                // DEPARTMENT

                profileDepartment.value =
                    profile.department ||
                    supervisor?.department ||
                    "";


                // SPECIALIZATION

                profileSpecialization.value =
                    profile.specialization ||
                    supervisor?.specialization ||
                    "Not specified";


                // PHONE FALLBACK

                if (!profilePhone.value) {

                    profilePhone.value =
                        supervisor?.phone || "";
                }


                // ACCOUNT STATUS

                profileStatus.value =
                    profile.status ||
                    supervisor?.status ||
                    "Active";


                // LOAD ASSIGNED STUDENTS

                await loadAssignedStudents();

            }

            catch (error) {

                console.error(
                    "Unexpected error:",
                    error
                );

                alert(
                    "Something went wrong while loading the supervisor profile."
                );
            }
        }


        // =========================================
        // LOAD ASSIGNED STUDENTS
        // =========================================

        async function loadAssignedStudents() {

            try {

                // GET ASSIGNED STUDENTS

                const {
                    data: students,
                    error: studentsError
                } = await db
                    .from("students")
                    .select(`
                        id,
                        major,
                        supervisor_id
                    `)
                    .eq("supervisor_id", supervisorId);

                if (studentsError) {

                    console.error(
                        "Students error:",
                        studentsError
                    );

                    profileStudentsCount.value = "0";

                    assignedStudentsList.innerHTML = `
                        <div class="admin-student-item">
                            <div class="admin-student-info">
                                <h3>Unable to load students</h3>
                                <p>Please try again.</p>
                            </div>
                        </div>
                    `;

                    return;
                }


                // NO STUDENTS

                if (!students || students.length === 0) {

                    profileStudentsCount.value = "0";

                    assignedStudentsList.innerHTML = `
                        <div class="admin-student-item">
                            <div class="admin-student-info">
                                <h3>No assigned students</h3>
                                <p>
                                    No students are currently assigned to this supervisor.
                                </p>
                            </div>
                        </div>
                    `;

                    return;
                }


                // STUDENT COUNT

                profileStudentsCount.value =
                    String(students.length);


                // GET STUDENT PROFILE IDS

                const studentIds =
                    students.map(student => student.id);


                // GET STUDENT PROFILES

                const {
                    data: profiles,
                    error: profilesError
                } = await db
                    .from("profiles")
                    .select(`
                        id,
                        full_name,
                        username,
                        email
                    `)
                    .in("id", studentIds);

                if (profilesError) {

                    console.error(
                        "Student profiles error:",
                        profilesError
                    );

                    assignedStudentsList.innerHTML = `
                        <div class="admin-student-item">
                            <div class="admin-student-info">
                                <h3>Unable to load student profiles</h3>
                                <p>Please try again.</p>
                            </div>
                        </div>
                    `;

                    return;
                }


                // CLEAR LIST

                assignedStudentsList.innerHTML = "";


                // DISPLAY FIRST STUDENT ONLY

                const visibleStudents =
                    students.slice(0, 1);

                visibleStudents.forEach(function(student) {

                    const studentProfile =
                        profiles?.find(
                            profile => profile.id === student.id
                        );

                    const studentName =
                        studentProfile?.full_name ||
                        studentProfile?.username ||
                        "Student";

                    const studentEmail =
                        studentProfile?.email ||
                        "No email";

                    const studentMajor =
                        student.major ||
                        "No major";

                    const initials =
                        studentName
                            .split(" ")
                            .filter(Boolean)
                            .slice(0, 2)
                            .map(word =>
                                word.charAt(0).toUpperCase()
                            )
                            .join("");

                    const studentItem =
                        document.createElement("div");

                    studentItem.className =
                        "admin-student-item";

                    studentItem.innerHTML = `

                        <div class="admin-student-avatar">
                            ${escapeHtml(initials)}
                        </div>

                        <div class="admin-student-info">

                            <h3>
                                ${escapeHtml(studentName)}
                            </h3>

                            <p>
                                ${escapeHtml(studentMajor)}
                            </p>

                            <span>
                                ${escapeHtml(studentEmail)}
                            </span>

                        </div>

                        <div class="student-report-actions">

                            <button
                                type="button"
                                class="student-report-button"
                                disabled
                            >
                                Checking Report...
                            </button>

                            <span class="student-report-status">
                                Checking supervisor confirmation...
                            </span>

                        </div>
                    `;

                    assignedStudentsList.appendChild(studentItem);

                    const reportButton =
                        studentItem.querySelector(
                            ".student-report-button"
                        );

                    const reportStatus =
                        studentItem.querySelector(
                            ".student-report-status"
                        );

                    setupStudentReportButton(
                        student.id,
                        studentName,
                        reportButton,
                        reportStatus
                    );

                });


                // VIEW ALL STUDENTS BUTTON

                if (students.length > 1) {

                    const viewAllWrapper =
                        document.createElement("div");

                    viewAllWrapper.className =
                        "view-all-students-wrapper";

                    viewAllWrapper.innerHTML = `

                        <a
                            href="admin-supervisor-students.html?id=${encodeURIComponent(supervisorId)}"
                            class="view-all-students-button"
                        >
                            View All Students
                        </a>

                    `;

                    assignedStudentsList.appendChild(
                        viewAllWrapper
                    );
                }

            }

            catch (error) {

                console.error(
                    "Assigned students error:",
                    error
                );

                profileStudentsCount.value = "0";

                assignedStudentsList.innerHTML = `
                    <div class="admin-student-item">
                        <div class="admin-student-info">
                            <h3>Unable to load students</h3>
                            <p>An unexpected error occurred.</p>
                        </div>
                    </div>
                `;
            }
        }


        // =========================================
        // REPORT WEIGHTS AND SCORE FORMATTING
        // =========================================

        const DEFAULT_REPORT_WEIGHTS = {
            written_report: 15,
            oral_presentation: 15,
            academic_supervisor: 30
        };


        function formatReportScore(value) {

            if (
                value === null ||
                value === undefined ||
                value === ""
            ) {
                return "--";
            }

            const number = Number(value);

            if (!Number.isFinite(number)) {
                return "--";
            }

            return number.toFixed(2).replace(/\.00$/, "");
        }


        function getReportWeights(evaluation) {

            const saved = evaluation?.grading_weights;

            if (
                !saved ||
                typeof saved !== "object" ||
                Array.isArray(saved)
            ) {
                return { ...DEFAULT_REPORT_WEIGHTS };
            }

            const weights = {
                written_report: Number(
                    saved.written_report ??
                    DEFAULT_REPORT_WEIGHTS.written_report
                ),

                oral_presentation: Number(
                    saved.oral_presentation ??
                    DEFAULT_REPORT_WEIGHTS.oral_presentation
                ),

                academic_supervisor: Number(
                    saved.academic_supervisor ??
                    DEFAULT_REPORT_WEIGHTS.academic_supervisor
                )
            };

            if (
                Object.values(weights).some(value =>
                    !Number.isFinite(value) || value < 0
                )
            ) {
                return { ...DEFAULT_REPORT_WEIGHTS };
            }

            return weights;
        }


        // =========================================
        // LOAD STUDENT EVALUATION FOR ADMIN
        // =========================================

        async function loadStudentEvaluationForAdmin(studentId) {

            // GET STUDENT APPLICATIONS

            const {
                data: applications,
                error: applicationsError
            } = await db
                .from("applications")
                .select(`
                    id,
                    internship_id,
                    status,
                    applied_at
                `)
                .eq("student_id", studentId)
                .order("applied_at", { ascending: false });

            if (applicationsError) {
                console.error(
                    "ADMIN APPLICATIONS ERROR:",
                    applicationsError
                );
                throw applicationsError;
            }

            const applicationList = applications || [];

            const acceptedApplications =
                applicationList.filter(item =>
                    String(item.status || "").toLowerCase() === "accepted"
                );

            const application =
                acceptedApplications[0] ||
                applicationList[0] ||
                null;

            console.log("ADMIN APPLICATIONS:", applicationList);
            console.log("ADMIN SELECTED APPLICATION:", application);
            console.log("ADMIN SELECTED APPLICATION ID:", application?.id);

            if (!application) {

                return {
                    evaluation: null,
                    companyName: "Company"
                };
            }


            // GET INTERNSHIP AND COMPANY

            let companyName = "Company";

            if (application.internship_id) {

                const {
                    data: internship,
                    error: internshipError
                } = await db
                    .from("internships")
                    .select("id, company_id")
                    .eq("id", application.internship_id)
                    .maybeSingle();

                if (internshipError) {
                    console.error(
                        "ADMIN INTERNSHIP ERROR:",
                        internshipError
                    );
                    throw internshipError;
                }

                if (internship?.company_id) {

                    const {
                        data: company,
                        error: companyError
                    } = await db
                        .from("companies")
                        .select("id, name")
                        .eq("id", internship.company_id)
                        .maybeSingle();

                    if (companyError) {
                        console.error(
                            "ADMIN COMPANY ERROR:",
                            companyError
                        );
                        throw companyError;
                    }

                    companyName = company?.name || "Company";
                }
            }


            // GET EVALUATION

            const {
                data: evaluation,
                error: evaluationError
            } = await db
                .from("evaluations")
                .select(`
                    id,
                    application_id,
                    company_evaluation_score,
                    written_report_score,
                    oral_presentation_score,
                    academic_supervisor_score,
                    final_grade,
                    grade_confirmed,
                    grade_confirmed_at,
                    grading_weights
                `)
                .eq("application_id", application.id)
                .maybeSingle();

            console.log("ADMIN EVALUATION APPLICATION ID:", application.id);
            console.log("ADMIN EVALUATION RESULT:", evaluation);
            console.log("ADMIN EVALUATION ERROR:", evaluationError);

            if (evaluationError) {
                throw evaluationError;
            }

            return {
                evaluation,
                companyName
            };
        }


        // =========================================
        // DOWNLOAD ALL STUDENTS REPORT
        // =========================================

        async function downloadAllStudentsReport() {

            const button = document.getElementById(
                "downloadAllStudentsReportButton"
            );

            const originalText = button.textContent;

            button.disabled = true;
            button.textContent = "Preparing Report...";

            try {

                // GET ALL STUDENTS ASSIGNED TO THIS SUPERVISOR

                const {
                    data: students,
                    error: studentsError
                } = await db
                    .from("students")
                    .select("id")
                    .eq("supervisor_id", supervisorId);

                if (studentsError) {
                    throw studentsError;
                }

                if (!students || students.length === 0) {

                    alert("This supervisor has no assigned students.");

                    return;
                }


                // GET STUDENT PROFILES

                const studentIds =
                    students.map(student => student.id);

                const {
                    data: profiles,
                    error: profilesError
                } = await db
                    .from("profiles")
                    .select("id, full_name, username")
                    .in("id", studentIds);

                if (profilesError) {
                    throw profilesError;
                }


                // GET REPORT DATA FOR ALL STUDENTS

                const reportStudents = await Promise.all(

                    students.map(async (student) => {

                        const studentProfile = profiles?.find(
                            profile => profile.id === student.id
                        );

                        const studentName =
                            studentProfile?.full_name ||
                            studentProfile?.username ||
                            "Student";

                        const result =
                            await loadStudentEvaluationForAdmin(student.id);

                        const evaluation = result.evaluation;

                        const isConfirmed =
                            evaluation?.grade_confirmed === true;

                        return {
                            studentName,

                            companyName:
                                result.companyName || "Company",

                            companyScore: isConfirmed
                                ? formatReportScore(
                                    evaluation.company_evaluation_score
                                )
                                : "—",

                            writtenScore: isConfirmed
                                ? formatReportScore(
                                    evaluation.written_report_score
                                )
                                : "—",

                            oralScore: isConfirmed
                                ? formatReportScore(
                                    evaluation.oral_presentation_score
                                )
                                : "—",

                            supervisorScore: isConfirmed
                                ? formatReportScore(
                                    evaluation.academic_supervisor_score
                                )
                                : "—",

                            finalGrade: isConfirmed
                                ? formatReportScore(
                                    evaluation.final_grade
                                )
                                : "—"
                        };

                    })

                );


                // CREATE REPORT ROWS

                const rows = reportStudents.map((student, index) => `

                    <tr>

                        <td>${index + 1}</td>

                        <td>${escapeHtml(student.studentName)}</td>

                        <td>${escapeHtml(student.companyName)}</td>

                        <td>${escapeHtml(student.companyScore)}</td>

                        <td>${escapeHtml(student.writtenScore)}</td>

        // =========================================

        // =========================================

        function downloadAdminEvaluationReport(
            studentName,
            companyName,
            evaluation
        ) {

            if (
                !evaluation ||
                evaluation.grade_confirmed !== true ||
                evaluation.final_grade === null ||
                evaluation.final_grade === undefined ||
                !Number.isFinite(Number(evaluation.final_grade))
            ) {
                return;
            }

            const weights =
                getReportWeights(evaluation);

            const components = [

                {
                    label: "Company Supervisor Evaluation",
                    score: evaluation.company_evaluation_score,
                    maximum: 40
                },

                {
                    label: "Written Internship Report",
                    score: evaluation.written_report_score,
                    maximum: weights.written_report
                },

                {
                    label: "Oral Presentation",
                    score: evaluation.oral_presentation_score,
                    maximum: weights.oral_presentation
                },

                {
                    label: "Academic Supervisor Evaluation",
                    score: evaluation.academic_supervisor_score,
                    maximum: weights.academic_supervisor
                }

            ];

            const rows = components.map(item => `
                <tr>
                    <td>${escapeHtml(item.label)}</td>
                    <td>${escapeHtml(formatReportScore(item.score))}</td>
                    <td>${escapeHtml(formatReportScore(item.maximum))}</td>
                </tr>
            `).join("");

        : "-"

         // OPEN REPORT

const reportWindow =
    window.open("", "_blank");

if (!reportWindow) {

}

reportWindow.document.open();
reportWindow.document.write(reportHTML);

}

        // =========================================
        // CHECK SUPERVISOR FINAL GRADE CONFIRMATION
        // =========================================

        async function setupStudentReportButton(
            studentId,
            studentName,
            button,
            status
        ) {

            button.disabled = true;

            button.textContent =
                "Checking Report...";

            status.textContent =
                "Checking supervisor confirmation...";

            status.className =
                "student-report-status";

            try {

                const result =
                    await loadStudentEvaluationForAdmin(studentId);

                const evaluation =
                    result.evaluation;

                const companyName =
                    result.companyName;

                console.log("ADMIN REPORT CHECK:");
                console.log("Student ID:", studentId);
                console.log("Evaluation:", evaluation);
                console.log("Grade Confirmed:", evaluation?.grade_confirmed);
                console.log("Final Grade:", evaluation?.final_grade);
                console.log("Company:", companyName);

                const isConfirmed =
                    evaluation &&
                    evaluation.grade_confirmed === true &&
                    evaluation.final_grade !== null &&
                    evaluation.final_grade !== undefined &&
                    evaluation.final_grade !== "" &&
                    Number.isFinite(Number(evaluation.final_grade));


                button.textContent =
                    "Final Grade Report";


                // NOT CONFIRMED YET

                if (!isConfirmed) {

                    button.disabled = true;

                    status.textContent =
                        "Pending Supervisor Confirmation";

                    status.className =
                        "student-report-status";

                    return;
                }


                // CONFIRMED

                button.disabled = false;

                status.textContent =
                    "Final Grade Confirmed";

                status.className =
                    "student-report-status ready";


                button.addEventListener("click", function() {

                    downloadAdminEvaluationReport(
                        studentName,
                        companyName,
                        evaluation
                    );

                });

            }

            catch (error) {

                console.error(
                    "Error loading student evaluation report:",
                    error
                );

                button.disabled = true;

                button.textContent =
                    "Final Grade Report";

                status.textContent =
                    "Report status unavailable";

                status.className =
                    "student-report-status";
            }
        }


        // =========================================
        // ESCAPE HTML
        // =========================================

        function escapeHtml(value) {

            if (!value) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        // =========================================
        // BACK BUTTON
        // =========================================

        document
            .getElementById("backButton")
            .addEventListener("click", function() {
