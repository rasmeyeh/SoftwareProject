
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Students</title>

    <link rel="stylesheet" href="./css/style.css">

    <style>

        .supervisor-report-section {
            display: flex;
            justify-content: flex-end;
            margin: 20px 0;
        }

        .supervisor-report-button {
            background: #234B57;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .supervisor-report-button:hover {
            background: #326D7A;
        }

        .supervisor-report-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="nav-content">

            <a
                href="supervisor-dashboard.html"
                class="brand"
            >

                <img
                    src="./images/alquds-university-logo.png"
                    alt="Al-Quds University Logo"
                    class="university-navbar-logo"
                >

                <img
                    src="./images/logo.png"
                    alt="PathLink"
                >

                <span>
                    PathLink
                </span>

            </a>


            <nav class="nav-links">

                <a href="supervisor-dashboard.html">
                    Dashboard
                </a>

                <a
                    href="supervisor-students.html"
                    class="active"
                >
                    My Students
                </a>

                <a href="supervisor-external-requests.html">
                    External Requests
                </a>

                <a href="supervisor-profile.html">
                    Profile
                </a>

                <a
                    href="index.html"
                    class="logout"
                    id="logoutLink"
                >
                    Logout
                </a>

            </nav>

        </div>

    </header>



    <!-- ================= MAIN ================= -->

    <main class="supervisor-dashboard">


        <!-- ================= WELCOME ================= -->

        <section class="supervisor-welcome">

            <div>

                <small>
                    MY STUDENTS
                </small>

                <h1>
                    Students Under My Supervision
                </h1>

                <p>
                    View and monitor the progress of students assigned to you.
                </p>

            </div>

        </section>



        <!-- ================= SUPERVISOR REPORT ================= -->

        <section class="supervisor-report-section">

            <button
                type="button"
                class="supervisor-report-button"
                id="downloadSupervisorReportButton"
                disabled
            >
                Download All Students Report
            </button>

        </section>



        <!-- ================= SEARCH & FILTER ================= -->

        <section class="applicants-filter">

            <div class="applicants-search">

                <span>
                    🔍
                </span>

                <input
                    type="text"
                    id="studentSearch"
                    placeholder="Search for a student..."
                >

            </div>


            <select id="statusFilter">

                <option value="all">
                    All Status
                </option>

                <option value="active">
                    Active
                </option>

                <option value="completed">
                    Completed
                </option>

            </select>

        </section>



        <!-- ================= STUDENTS ================= -->

        <section id="studentsList">

            <p
                id="loadingMessage"
                style="
                    text-align: center;
                    padding: 30px;
                    color: #6f7d80;
                "
            >
                Loading students...
            </p>

        </section>



        <!-- ================= NO RESULTS ================= -->

        <div
            id="noStudents"
            style="
                display: none;
                text-align: center;
                padding: 30px;
                color: #6f7d80;
            "
        >
            No students found.
        </div>


    </main>



    <!-- ================= JAVASCRIPT ================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="./js/supabase.js"></script>


    <script>

        let allStudents = [];


        /* =========================================
           ESCAPE HTML
        ========================================= */

        function escapeHTML(value) {

            if (
                value === null ||
                value === undefined
            ) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }



        /* =========================================
           LOAD SUPERVISOR STUDENTS
        ========================================= */

        async function loadStudents() {

            try {

                const {
                    data: {
                        user
                    },
                    error: userError
                } = await db.auth.getUser();


                if (userError) {
                    throw userError;
                }


                if (!user) {

                    window.location.href =
                        "index.html";

                    return;

                }


                const {
                    data: students,
                    error: studentsError
                } = await db
                    .from("students")
                    .select(`
                        id,
                        major,
                        university,
                        supervisor_id
                    `)
                    .eq(
                        "supervisor_id",
                        user.id
                    );


                if (studentsError) {
                    throw studentsError;
                }


                const studentList =
                    students || [];


                if (
                    studentList.length === 0
                ) {

                    allStudents = [];


                    document.getElementById(
                        "studentsList"
                    ).innerHTML = "";


                    document.getElementById(
                        "noStudents"
                    ).style.display =
                        "block";


                    document.getElementById(
                        "downloadSupervisorReportButton"
                    ).disabled = true;


                    return;

                }


                const studentIds =
                    studentList.map(
                        student => student.id
                    );


                const {
                    data: profiles,
                    error: profilesError
                } = await db
                    .from("profiles")
                    .select(`
                        id,
                        full_name,
                        username,
                        email,
                        phone
                    `)
                    .in(
                        "id",
                        studentIds
                    );


                if (profilesError) {
                    throw profilesError;
                }


                const {
                    data: applications,
                    error: applicationsError
                } = await db
                    .from("applications")
                    .select(`
                        id,
                        student_id,
                        internship_id,
                        status,
                        applied_at
                    `)
                    .in(
                        "student_id",
                        studentIds
                    );


                if (applicationsError) {
                    throw applicationsError;
                }


                const applicationList =
                    applications || [];


                const internshipIds =
                    [
                        ...new Set(
                            applicationList
                                .map(
                                    application =>
                                        application.internship_id
                                )
                                .filter(Boolean)
                        )
                    ];


                let internships = [];


                if (
                    internshipIds.length > 0
                ) {

                    const {
                        data: internshipData,
                        error: internshipError
                    } = await db
                        .from("internships")
                        .select(`
                            id,
                            company_id,
                            title,
                            field,
                            city,
                            start_date,
                            end_date,
                            status
                        `)
                        .in(
                            "id",
                            internshipIds
                        );


                    if (internshipError) {
                        throw internshipError;
                    }


                    internships =
                        internshipData || [];

                }


                const companyIds =
                    [
                        ...new Set(
                            internships
                                .map(
                                    internship =>
                                        internship.company_id
                                )
                                .filter(Boolean)
                        )
                    ];


                let companies = [];


                if (
                    companyIds.length > 0
                ) {

                    const {
                        data: companyData,
                        error: companyError
                    } = await db
                        .from("companies")
                        .select(`
                            id,
                            name
                        `)
                        .in(
                            "id",
                            companyIds
                        );


                    if (companyError) {
                        throw companyError;
                    }


                    companies =
                        companyData || [];

                }



                /* =========================================
                   GET STUDENT EVALUATIONS
                ========================================= */

                let evaluations = [];

                const applicationIds =
                    applicationList.map(
                        application => application.id
                    );


                if (
                    applicationIds.length > 0
                ) {

                    const {
                        data: evaluationData,
                        error: evaluationError
                    } = await db
                        .from("evaluations")
                        .select(`
                            id,
                            application_id,
                            company_evaluation_score,
                            written_report_score,
                            oral_presentation_score,
                            academic_supervisor_score,
                            final_grade,
                            grade_confirmed,
                            grade_confirmed_at
                        `)
                        .in(
                            "application_id",
                            applicationIds
                        );


                    if (evaluationError) {
                        throw evaluationError;
                    }


                    evaluations =
                        evaluationData || [];

                }



                /* =========================================
                   CREATE DATA MAPS
                ========================================= */

                const profileMap = {};


                (profiles || []).forEach(
                    profile => {

                        profileMap[
                            profile.id
                        ] = profile;

                    }
                );


                const internshipMap = {};


                internships.forEach(
                    internship => {

                        internshipMap[
                            internship.id
                        ] = internship;

                    }
                );


                const companyMap = {};


                companies.forEach(
                    company => {

                        companyMap[
                            company.id
                        ] = company;

                    }
                );


                const evaluationMap = {};


                evaluations.forEach(
                    evaluation => {

                        evaluationMap[
                            evaluation.application_id
                        ] = evaluation;

                    }
                );



                /* =========================================
                   BUILD STUDENTS DATA
                ========================================= */

                allStudents =
                    studentList.map(
                        student => {

                            const profile =
                                profileMap[
                                    student.id
                                ] || {};


                            const studentApplications =
                                applicationList.filter(
                                    application =>
                                        application.student_id ===
                                        student.id
                                );


                            let application =
                                studentApplications.find(
                                    item =>
                                        item.status ===
                                        "accepted"
                                );


                            if (
                                !application &&
                                studentApplications.length > 0
                            ) {

                                application =
                                    [
                                        ...studentApplications
                                    ].sort(
                                        (a, b) =>
                                            new Date(
                                                b.applied_at
                                            ) -
                                            new Date(
                                                a.applied_at
                                            )
                                    )[0];

                            }


                            const internship =
                                application
                                    ? internshipMap[
                                        application.internship_id
                                    ]
                                    : null;


                            const company =
                                internship
                                    ? companyMap[
                                        internship.company_id
                                    ]
                                    : null;


                            const evaluation =
                                application
                                    ? evaluationMap[
                                        application.id
                                    ] || null
                                    : null;


                            return {

                                id: student.id,

                                name:
                                    profile.full_name ||
                                    profile.username ||
                                    "Student",

                                username:
                                    profile.username ||
                                    "",

                                major:
                                    student.major ||
                                    "Major not specified",

                                email:
                                    profile.email ||
                                    "—",

                                company:
                                    company
                                        ? company.name
                                        : "No company assigned",

                                applicationStatus:
                                    application
                                        ? application.status
                                        : "pending",

                                internship:
                                    internship || null,

                                internshipTitle:
                                    internship
                                        ? internship.title ||
                                          internship.field ||
                                          "—"
                                        : "—",

                                evaluation:
                                    evaluation

                            };

                        }
                    );


                document.getElementById(
                    "downloadSupervisorReportButton"
                ).disabled =
                    allStudents.length === 0;


                renderStudents();


            } catch (error) {

                console.error(
                    "Supervisor students error:",
                    error
                );


                document.getElementById(
                    "downloadSupervisorReportButton"
                ).disabled = true;


                document.getElementById(
                    "studentsList"
                ).innerHTML = `
                    <p
                        style="
                            text-align: center;
                            padding: 30px;
                            color: #b44;
                        "
                    >
                        Unable to load students.
                    </p>
                `;

            }

        }



        /* =========================================
           GET STUDENT STATUS
        ========================================= */

        function getStudentStatus(student) {

            if (
                student.applicationStatus !==
                "accepted"
            ) {

                return "active";

            }


            if (
                student.internship &&
                student.internship.end_date
            ) {

                const endDate =
                    new Date(
                        student.internship.end_date
                    );


                if (
                    endDate <
                    new Date()
                ) {

                    return "completed";

                }

            }


            return "active";

        }



        /* =========================================
           RENDER STUDENTS
        ========================================= */

        function renderStudents() {

            const container =
                document.getElementById(
                    "studentsList"
                );


            const noStudents =
                document.getElementById(
                    "noStudents"
                );


            const searchInput =
                document.getElementById(
                    "studentSearch"
                );


            const statusFilter =
                document.getElementById(
                    "statusFilter"
                );


            const searchValue =
                searchInput.value
                    .toLowerCase()
                    .trim();


            const selectedStatus =
                statusFilter.value;


            const filteredStudents =
                allStudents.filter(
                    student => {

                        const studentName =
                            student.name
                                .toLowerCase();


                        const studentStatus =
                            getStudentStatus(
                                student
                            );


                        const matchesSearch =
                            studentName.includes(
                                searchValue
                            );


                        const matchesStatus =
                            selectedStatus ===
                                "all" ||
                            selectedStatus ===
                                studentStatus;


                        return (
                            matchesSearch &&
                            matchesStatus
                        );

                    }
                );


            if (
                filteredStudents.length === 0
            ) {

                container.innerHTML = "";

                noStudents.style.display =
                    "block";

                return;

            }


            noStudents.style.display =
                "none";


            container.innerHTML =
                filteredStudents
                    .map(
                        student => {

                            const status =
                                getStudentStatus(
                                    student
                                );


                            const statusText =
                                status ===
                                    "completed"
                                    ? "Completed"
                                    : "Active";


                            const firstLetters =
                                student.name
                                    .trim()
                                    .split(/\s+/)
                                    .slice(0, 2)
                                    .map(
                                        word =>
                                            word
                                                .charAt(0)
                                                .toUpperCase()
                                    )
                                    .join("");


                            return `

                                <div
                                    class="supervisor-student-row"
                                    data-name="${escapeHTML(
                                        student.name
                                    )}"
                                    data-status="${status}"
                                >

                                    <div class="student-avatar">
                                        ${escapeHTML(
                                            firstLetters
                                        )}
                                    </div>


                                    <div class="student-info">

                                        <h3>
                                            ${escapeHTML(
                                                student.name
                                            )}
                                        </h3>

                                        <p>
                                            ${escapeHTML(
                                                student.major
                                            )}
                                        </p>

                                    </div>


                                    <div class="student-company">

                                        <span>
                                            Internship Company
                                        </span>

                                        <strong>
                                            ${escapeHTML(
                                                student.company
                                            )}
                                        </strong>

                                    </div>


                                    <span
                                        class="internship-status ${status}"
                                    >
                                        ${statusText}
                                    </span>


                                    <a
                                        href="student-progress.html?id=${encodeURIComponent(
                                            student.id
                                        )}"
                                        class="review-button"
                                    >
                                        View
                                    </a>

                                </div>

                            `;

                        }
                    )
                    .join("");

        }



        /* =========================================
           DOWNLOAD ALL STUDENTS REPORT
        ========================================= */

        function downloadSupervisorReport() {

            if (allStudents.length === 0) {

                alert(
                    "There are no students to include in the report."
                );

                return;

            }


            function displayScore(value, confirmed) {

                if (
                    !confirmed ||
                    value === null ||
                    value === undefined
                ) {

                    return "—";

                }

                return escapeHTML(value);

            }


            const tableRows =
                allStudents.map(
                    (student, index) => {

                        const evaluation =
                            student.evaluation;


                        const isConfirmed =
                            evaluation &&
                            evaluation.grade_confirmed === true;


                        return `

                            <tr>

                                <td>
                                    ${index + 1}
                                </td>

                                <td>
                                    ${escapeHTML(student.name)}
                                </td>

                                <td>
                                    ${escapeHTML(student.company)}
                                </td>

                                <td>
                                    ${displayScore(
                                        evaluation?.company_evaluation_score,
                                        isConfirmed
                                    )}
                                </td>

                                <td>
                                    ${displayScore(
                                        evaluation?.written_report_score,
                                        isConfirmed
                                    )}
                                </td>

                                <td>
                                    ${displayScore(
                                        evaluation?.oral_presentation_score,
                                        isConfirmed
                                    )}
                                </td>

                                <td>
                                    ${displayScore(
                                        evaluation?.academic_supervisor_score,
                                        isConfirmed
                                    )}
                                </td>

                                <td>
                                    ${displayScore(
                                        evaluation?.final_grade,
                                        isConfirmed
                                    )}
                                </td>

                            </tr>

                        `;

                    }
                ).join("");



            const reportHTML = `

                <!DOCTYPE html>

                <html lang="en">

                <head>

                    <meta charset="UTF-8">

                    <meta
                        name="viewport"
                        content="width=device-width, initial-scale=1.0"
                    >

                    <title>
                        Students Grades
                    </title>


                    <style>

                        body {
                            font-family: Arial, sans-serif;
                            margin: 30px;
                            color: #292B2D;
                        }


                        table {
                            width: 100%;
                            border-collapse: collapse;
                            font-size: 13px;
                            margin-top: 20px;
                        }


                        th,
                        td {
                            border: 1px solid #d8d8d8;
                            padding: 12px 8px;
                            text-align: center;
                        }


                        th {
                            background: #234B57;
                            color: white;
                            font-weight: 600;
                        }


                        tr:nth-child(even) {
                            background: #F3EEE6;
                        }


                        td:nth-child(2),
                        td:nth-child(3) {
                            text-align: left;
                        }


                        .print-button {
                            background: #234B57;
                            color: white;
                            border: none;
                            padding: 11px 20px;
                            border-radius: 6px;
                            cursor: pointer;
                            font-size: 14px;
                            margin-bottom: 15px;
                        }


                        @media print {

                            body {
                                margin: 10px;
                            }

                            .print-button {
                                display: none;
                            }

                            th {
                                background: #234B57 !important;
                                color: white !important;
                                print-color-adjust: exact;
                                -webkit-print-color-adjust: exact;
                            }

                            tr:nth-child(even) {
                                background: #F3EEE6 !important;
                                print-color-adjust: exact;
                                -webkit-print-color-adjust: exact;
                            }

                        }

                    </style>

                </head>


                <body>


                  


                    <table>

                        <thead>

                            <tr>

                                <th>#</th>

                                <th>
                                    Student Name
                                </th>

                                <th>
                                    Company
                                </th>

                                <th>
                                    Company Evaluation /40
                                </th>

                                <th>
                                    Written Report /15
                                </th>

                                <th>
                                    Oral Presentation /15
                                </th>

                                <th>
                                    Academic Supervisor /30
                                </th>

                                <th>
                                    Final Grade /100
                                </th>

                            </tr>

                        </thead>


                        <tbody>

                            ${tableRows}

                        </tbody>

                    </table>


                </body>

                </html>

            `;


            const reportWindow =
                window.open(
                    "",
                    "_blank"
                );


            if (!reportWindow) {

                alert(
                    "Please allow pop-ups to open the report."
                );

                return;

            }


            reportWindow.document.open();

            reportWindow.document.write(
                reportHTML
            );

            reportWindow.document.close();

        }



        /* =========================================
           SEARCH
        ========================================= */

        document
            .getElementById("studentSearch")
            .addEventListener(
                "input",
                renderStudents
            );



        /* =========================================
           STATUS FILTER
        ========================================= */

        document
            .getElementById("statusFilter")
            .addEventListener(
                "change",
                renderStudents
            );



        /* =========================================
           SUPERVISOR REPORT BUTTON
        ========================================= */

        document
            .getElementById("downloadSupervisorReportButton")
            .addEventListener(
                "click",
                downloadSupervisorReport
            );



        /* =========================================
           LOGOUT
        ========================================= */

        document
            .getElementById("logoutLink")
            .addEventListener(
                "click",
                async function (event) {

                    event.preventDefault();

                    await db.auth.signOut();

                    window.location.href =
                        "index.html";

                }
            );



        /* =========================================
           START
        ========================================= */

        loadStudents();

    </script>


</body>

</html>
