
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Internships</title>

    <link rel="stylesheet" href="./css/style.css">

    <style>
        /* NO FILTER RESULTS MESSAGE */

        #noFilterResults {
            grid-column: 1 / -1 !important;
            display: block !important;
            width: 100% !important;
        }

        #noFilterResults .admin-internship-info {
            width: 100% !important;
            min-width: 0 !important;
        }

        #noFilterResults .admin-internship-info h3,
        #noFilterResults .admin-internship-info p {
            white-space: normal !important;
            display: block !important;
            width: 100% !important;
        }

        /* APPROVAL STATUS */

        .admin-approval-status {
            display: inline-block;
            width: fit-content;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: capitalize;
            white-space: nowrap;
        }

        .admin-approval-status.pending {
            background: #fff1d6;
            color: #95620b;
        }

        .admin-approval-status.approved {
            background: #e1f3e7;
            color: #287744;
        }

        .admin-approval-status.rejected {
            background: #fbe5e5;
            color: #a83232;
        }

        .admin-internship-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-wrap: nowrap;
            min-width: 220px;
        }

        .admin-internship-actions button {
            flex: 0 0 auto;
            white-space: nowrap;
        }

        .admin-internship-item {
            min-width: 0;
        }

        .admin-internship-info {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .admin-approval-button {
            border: none;
            border-radius: 6px;
            padding: 9px 13px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .admin-approval-button.approve {
            background: #e1f3e7;
            color: #287744;
        }

        .admin-approval-button.reject {
            background: #fbe5e5;
            color: #a83232;
        }

        .admin-approval-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .admin-approval-button:not(:disabled):hover {
            filter: brightness(0.95);
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <div class="nav-content">

            <a href="admin-dashboard.html" class="brand">

                <img
                    src="./images/alquds-university-logo.png"
                    alt="Al-Quds University Logo"
                    class="university-navbar-logo"
                >

                <img
                    src="./images/logo.png"
                    alt="PathLink Logo"
                >

                <span>PathLink</span>

            </a>

            <nav class="nav-links">

                <a href="admin-dashboard.html">
                    Dashboard
                </a>

                <a href="admin-internships.html" class="active">
                    Internships
                </a>

                <a href="admin-profile.html">
                    Profile
                </a>

                <a
                    href="index.html"
                    class="logout"
                    id="logoutButton"
                >
                    Logout
                </a>

            </nav>

        </div>

    </header>


    <!-- MAIN -->

    <main class="admin-internships-page">

        <a href="admin-dashboard.html" class="admin-back">
            ← Back to Dashboard
        </a>


        <!-- PAGE HEADER -->

        <div class="admin-internships-header">

            <div>

                <p class="admin-internships-label">
                    INTERNSHIP MANAGEMENT
                </p>

                <h1>Manage Internships</h1>

                <p>
                    View and manage internship opportunities posted by companies.
                </p>

            </div>

        </div>


        <!-- INTERNSHIPS CARD -->

        <section class="admin-internships-card">

            <!-- TOOLBAR -->

            <div class="admin-internships-toolbar">

                <input
                    type="text"
                    id="internshipSearch"
                    class="admin-internship-search"
                    placeholder="Search internships or companies..."
                >

                <!-- APPLICATION PERIOD STATUS -->

                <select
                    id="internshipStatus"
                    class="admin-internship-filter"
                >

                    <option value="all">All Application Status</option>
                    <option value="upcoming">Upcoming</option>
                    <option value="active">Active</option>
                    <option value="ended">Ended</option>

                </select>


                <!-- APPROVAL STATUS -->

                <select
                    id="approvalFilter"
                    class="admin-internship-filter"
                >

                    <option value="all">All Approval Status</option>
                    <option value="pending">Pending</option>
                    <option value="approved">Approved</option>
                    <option value="rejected">Rejected</option>

                </select>


                <!-- FIELD -->

                <select
                    id="internshipField"
                    class="admin-internship-filter"
                >

                    <option value="all">All Fields</option>

                </select>


                <!-- CITY -->

                <select
                    id="internshipCity"
                    class="admin-internship-filter"
                >

                    <option value="all">All Cities</option>

                </select>

            </div>


            <!-- INTERNSHIP LIST -->

            <div
                class="admin-internships-list"
                id="internshipList"
            >

                <div class="admin-internship-item">

                    <div class="admin-internship-info">

                        <h3>Loading internships...</h3>

                        <p>Please wait</p>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="home-footer">

        <p>
            © 2026 PathLink
        </p>

    </footer>

</div>
    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/supabase.js"></script>


    <!-- JAVASCRIPT -->

    <script>

        /* =========================================
           ELEMENTS
        ========================================= */

        const searchInput =
            document.getElementById("internshipSearch");

        const statusFilter =
            document.getElementById("internshipStatus");

        const approvalFilter =
            document.getElementById("approvalFilter");

        const fieldFilter =
            document.getElementById("internshipField");

        const cityFilter =
            document.getElementById("internshipCity");

        const internshipList =
            document.getElementById("internshipList");

        const logoutButton =
            document.getElementById("logoutButton");


        /* =========================================
           STORE INTERNSHIPS
        ========================================= */

        let internshipItems = [];


        /* =========================================
           ESCAPE HTML
        ========================================= */

        function escapeHtml(value) {

            if (value === null || value === undefined) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        /* =========================================
           FORMAT DATE
           DD/MM/YYYY
        ========================================= */

        function formatDate(dateValue) {

            if (!dateValue) {
                return "Date not specified";
            }

            const parts = dateValue.split("-");

            if (parts.length !== 3) {
                return "Date not specified";
            }

            const [year, month, day] = parts;

            return `${day}/${month}/${year}`;
        }


        /* =========================================
           GET TODAY'S DATE
           HEBRON TIMEZONE
        ========================================= */

        function getTodayDate() {

            const parts = new Intl.DateTimeFormat(
                "en-CA",
                {
                    timeZone: "Asia/Hebron",
                    year: "numeric",
                    month: "2-digit",
                    day: "2-digit"
                }
            ).formatToParts(new Date());

            const values = {};

            parts.forEach(part => {
                values[part.type] = part.value;
            });

            return `${values.year}-${values.month}-${values.day}`;
        }


        /* =========================================
           GET APPLICATION STATUS

           Status depends ONLY on:
           application_start_date
           application_end_date
        ========================================= */

        function getInternshipStatus(
            applicationStartDate,
            applicationEndDate
        ) {

            if (
                !applicationStartDate ||
                !applicationEndDate
            ) {
                return "unavailable";
            }

            const today = getTodayDate();

            if (today < applicationStartDate) {
                return "upcoming";
            }

            if (today > applicationEndDate) {
                return "ended";
            }

            return "active";
        }


        /* =========================================
           STATUS TEXT
        ========================================= */

        function getStatusText(status) {

            if (status === "upcoming") {
                return "Upcoming";
            }

            if (status === "ended") {
                return "Ended";
            }

            if (status === "unavailable") {
                return "Dates Not Set";
            }

            return "Active";
        }


        /* =========================================
           APPROVAL STATUS TEXT
        ========================================= */

        function getApprovalStatusText(status) {

            if (status === "approved") {
                return "Approved";
            }

            if (status === "rejected") {
                return "Rejected";
            }

            return "Pending";
        }


        /* =========================================
           LOAD FILTER OPTIONS
        ========================================= */

        function loadFilterOptions() {

            /* FIELDS */

            const fields = [
                ...new Set(
                    internshipItems
                        .map(internship => internship.field)
                        .filter(Boolean)
                )
            ].sort((a, b) => a.localeCompare(b));


            fieldFilter.innerHTML = `
                <option value="all">All Fields</option>
            `;

            fields.forEach(field => {

                const option = document.createElement("option");

                option.value = field;
                option.textContent = field;

                fieldFilter.appendChild(option);

            });


            /* CITIES */

            const cities = [
                ...new Set(
                    internshipItems
                        .map(internship => internship.city)
                        .filter(Boolean)
                )
            ].sort((a, b) => a.localeCompare(b));


            cityFilter.innerHTML = `
                <option value="all">All Cities</option>
            `;

            cities.forEach(city => {

                const option = document.createElement("option");

                option.value = city;
                option.textContent = city;

                cityFilter.appendChild(option);

            });

        }


        /* =========================================
           LOAD INTERNSHIPS
        ========================================= */

        async function loadInternships() {

            try {

                /* CHECK LOGIN */

                const {
                    data: { user },
                    error: userError
                } = await db.auth.getUser();


                if (userError || !user) {

                    alert("Please login first.");

                    window.location.href = "index.html";

                    return;

                }


                /* CHECK ADMIN */

                const {
                    data: adminProfile,
                    error: adminError
                } = await db

                    .from("profiles")

                    .select("id, role")

                    .eq("id", user.id)

                    .maybeSingle();


                if (
                    adminError ||
                    !adminProfile ||
                    adminProfile.role !== "admin"
                ) {

                    alert("Access denied.");

                    window.location.href = "index.html";

                    return;

                }


                /* GET INTERNSHIPS */

                const {
                    data: internships,
                    error: internshipsError
                } = await db

                    .from("internships")

                    .select(`
                        id,
                        company_id,
                        title,
                        field,
                        city,
                        description,
                        requirements,
                        application_start_date,
                        application_end_date,
                        start_date,
                        end_date,
                        status,
                        approval_status,
                        created_at,
                        working_hours
                    `)

                    .order("created_at", {
                        ascending: false
                    });


                if (internshipsError) {

                    console.error(
                        "Internships loading error:",
                        internshipsError
                    );

                    showMessage(
                        "Unable to load internships",
                        "Please try again."
                    );

                    return;

                }


                /* NO INTERNSHIPS */

                if (!internships || internships.length === 0) {

                    internshipItems = [];

                    loadFilterOptions();

                    showMessage(
                        "No internships found",
                        "No internship opportunities have been posted yet."
                    );

                    return;

                }


                /* GET COMPANY IDS */

                const companyIds = [
                    ...new Set(
                        internships
                            .map(internship => internship.company_id)
                            .filter(Boolean)
                    )
                ];


                /* GET COMPANIES */

                let companies = [];

                if (companyIds.length > 0) {

                    const {
                        data,
                        error: companiesError
                    } = await db

                        .from("companies")

                        .select(`
                            id,
                            name,
                            city,
                            field,
                            logo_url
                        `)

                        .in("id", companyIds);


                    if (companiesError) {

                        console.error(
                            "Companies loading error:",
                            companiesError
                        );

                    }

                    companies = data || [];

                }


                /* CREATE COMPANY MAP */

                const companyMap = new Map();

                companies.forEach(company => {

                    companyMap.set(company.id, company);

                });


                /* PREPARE DATA */

                internshipItems = internships.map(internship => {

                    const company =
                        companyMap.get(internship.company_id);

                    const status = getInternshipStatus(
                        internship.application_start_date,
                        internship.application_end_date
                    );

                    return {

                        ...internship,

                        company: company || null,

                        displayStatus: status,

                        approval_status:
                            internship.approval_status || "pending"

                    };

                });


                /* FILTER OPTIONS */

                loadFilterOptions();


                /* DISPLAY */

                renderInternships();

            }

            catch (error) {

                console.error(
                    "Unexpected internships error:",
                    error
                );

                showMessage(
                    "Unable to load internships",
                    "An unexpected error occurred."
                );

            }

        }


        /* =========================================
           SHOW MESSAGE
        ========================================= */

        function showMessage(title, message) {

            internshipList.innerHTML = `

                <div class="admin-internship-item">

                    <div class="admin-internship-info">

                        <h3>${escapeHtml(title)}</h3>

                        <p>${escapeHtml(message)}</p>

                    </div>

                </div>

            `;

        }


        /* =========================================
           RENDER INTERNSHIPS
        ========================================= */

        function renderInternships() {

            internshipList.innerHTML = "";


            if (internshipItems.length === 0) {

                showMessage(
                    "No internships found",
                    "No internship opportunities are available."
                );

                return;

            }


            internshipItems.forEach(internship => {

                const company = internship.company;

                const companyName =
                    company?.name || "Unknown Company";

                const field =
                    internship.field ||
                    company?.field ||
                    "Not specified";

                const city =
                    internship.city ||
                    company?.city ||
                    "Not specified";


                /* APPLICATION STATUS */

                const status = internship.displayStatus;

                const statusText = getStatusText(status);


                /* APPROVAL STATUS */

                const approvalStatus =
                    internship.approval_status;

                const approvalText =
                    getApprovalStatusText(approvalStatus);


                /* TRAINING DATES */

                const startDate =
                    formatDate(internship.start_date);

                const endDate =
                    formatDate(internship.end_date);


                /* APPLICATION DATES */

                const applicationStartDate =
                    formatDate(internship.application_start_date);

                const applicationEndDate =
                    formatDate(internship.application_end_date);


                /* CREATE ITEM */

                const internshipItem =
                    document.createElement("div");

                internshipItem.className =
                    "admin-internship-item";

                internshipItem.dataset.status = status;

                internshipItem.dataset.approval =
                    approvalStatus;

                internshipItem.dataset.field = field;

                internshipItem.dataset.city = city;

                internshipItem.dataset.id = internship.id;


                /* COMPANY INITIAL */

                const companyInitial =
                    companyName.charAt(0).toUpperCase() || "I";


                internshipItem.innerHTML = `

                    <div class="admin-internship-icon">
                        ${escapeHtml(companyInitial)}
                    </div>


                    <div class="admin-internship-info">

                        <h3>
                            ${escapeHtml(
                                internship.title || "Untitled Internship"
                            )}
                        </h3>

                        <p>
                            ${escapeHtml(companyName)}
                        </p>


                        <div class="admin-internship-meta">

                            <span>
                                ${escapeHtml(field)}
                            </span>

                            <span>
                                ${escapeHtml(city)}
                            </span>

                            <span>
                                Training:
                                ${escapeHtml(startDate)}
                                –
                                ${escapeHtml(endDate)}
                            </span>

                            <span>
                                Application:
                                ${escapeHtml(applicationStartDate)}
                                –
                                ${escapeHtml(applicationEndDate)}
                            </span>

                        </div>

                    </div>


                    <div class="admin-internship-status ${escapeHtml(status)}">
                        ${escapeHtml(statusText)}
                    </div>


                    <div class="admin-approval-status ${escapeHtml(approvalStatus)}">
                        ${escapeHtml(approvalText)}
                    </div>


                    <div class="admin-internship-actions">

                        <button
                            type="button"
                            class="admin-approval-button approve"
                            data-action="approve"
                            data-id="${escapeHtml(internship.id)}"
                            ${approvalStatus !== "pending" ? "disabled" : ""}
                        >
                            Approve
                        </button>

                        <button
                            type="button"
                            class="admin-approval-button reject"
                            data-action="reject"
                            data-id="${escapeHtml(internship.id)}"
                            ${approvalStatus !== "pending" ? "disabled" : ""}
                        >
                            Reject
                        </button>

                        <button
                            type="button"
                            class="admin-internship-delete"
                            data-action="delete"
                            data-id="${escapeHtml(internship.id)}"
                        >
                            Delete
                        </button>

                    </div>

                `;


                internshipList.appendChild(internshipItem);

            });


            filterInternships();

        }


        /* =========================================
           FILTER INTERNSHIPS
        ========================================= */

        function filterInternships() {

            const searchValue =
                searchInput.value.toLowerCase().trim();

            const selectedStatus =
                statusFilter.value;

            const selectedApproval =
                approvalFilter.value;

            const selectedField =
                fieldFilter.value;

            const selectedCity =
                cityFilter.value;


            const items = internshipList.querySelectorAll(
                ".admin-internship-item"
            );


            let visibleCount = 0;


            items.forEach(internship => {

                if (internship.id === "noFilterResults") {
                    return;
                }


                const text =
                    internship.textContent.toLowerCase();

                const status =
                    internship.dataset.status;

                const approval =
                    internship.dataset.approval;

                const field =
                    internship.dataset.field;

                const city =
                    internship.dataset.city;


                /* SEARCH */

                const matchesSearch =
                    text.includes(searchValue);


                /* APPLICATION STATUS */

                const matchesStatus =
                    selectedStatus === "all" ||
                    status === selectedStatus;


                /* APPROVAL STATUS */

                const matchesApproval =
                    selectedApproval === "all" ||
                    approval === selectedApproval;


                /* FIELD */

                const matchesField =
                    selectedField === "all" ||
                    field === selectedField;


                /* CITY */

                const matchesCity =
                    selectedCity === "all" ||
                    city === selectedCity;


                /* DISPLAY */

                if (
                    matchesSearch &&
                    matchesStatus &&
                    matchesApproval &&
                    matchesField &&
                    matchesCity
                ) {

                    internship.style.display = "grid";

                    visibleCount++;

                }

                else {

                    internship.style.display = "none";

                }

            });


            /* REMOVE OLD MESSAGE */

            const existingMessage =
                document.getElementById("noFilterResults");

            if (existingMessage) {
                existingMessage.remove();
            }


            /* SHOW NO RESULTS MESSAGE */

            if (
                visibleCount === 0 &&
                internshipItems.length > 0
            ) {

                const message =
                    document.createElement("div");

                message.id = "noFilterResults";

                message.className = "admin-internship-item";

                message.innerHTML = `

                    <div class="admin-internship-info">

                        <h3>No matching internships</h3>

                        <p>
                            Try changing the search or filters.
                        </p>

                    </div>

                `;

                internshipList.appendChild(message);

            }

        }


        /* =========================================
           UPDATE APPROVAL STATUS
        ========================================= */

        async function updateApprovalStatus(
            button,
            internshipId,
            newStatus
        ) {

            const internship =
                internshipItems.find(
                    item => item.id === internshipId
                );

            if (!internship) {
                return;
            }


            const actionText =
                newStatus === "approved" ? "approve" : "reject";


            const confirmed = confirm(
                `Are you sure you want to ${actionText} "${internship.title}"?`
            );

            if (!confirmed) {
                return;
            }


            button.disabled = true;

            const originalText = button.textContent;

            button.textContent = "Saving...";


            try {

                /* UPDATE APPROVAL STATUS */

                const {
                    data: updatedInternship,
                    error
                } = await db

                    .from("internships")

                    .update({
                        approval_status: newStatus
                    })

                    .eq("id", internshipId)

                    .select("id, approval_status")

                    .maybeSingle();


                /* CHECK UPDATE RESULT */

                if (error || !updatedInternship) {

                    console.error(
                        "Approval update error:",
                        error
                    );

                    alert(
                        error
                            ? `Update failed: ${error.message}`
                            : "No internship was updated. Check the Admin permissions."
                    );

                    button.disabled = false;

                    button.textContent = originalText;

                    return;

                }


                /* UPDATE LOCAL DATA */

                internship.approval_status =
                    updatedInternship.approval_status;


                /* RENDER UPDATED DATA */

                renderInternships();


                alert(
                    newStatus === "approved"
                        ? "Internship approved successfully."
                        : "Internship rejected successfully."
                );

            }

            catch (error) {

                console.error(
                    "Unexpected approval error:",
                    error
                );

                alert(
                    `An unexpected error occurred: ${error.message}`
                );

                button.disabled = false;

                button.textContent = originalText;

            }

        }


        /* =========================================
           DELETE INTERNSHIP
        ========================================= */

        async function deleteInternship(
            button,
            internshipId
        ) {

            const internship =
                internshipItems.find(
                    item => item.id === internshipId
                );

            if (!internship) {
                return;
            }


            const confirmed = confirm(
                `Are you sure you want to delete "${internship.title}"?`
            );

            if (!confirmed) {
                return;
            }


            button.disabled = true;


            try {

                const {
                    error
                } = await db

                    .from("internships")

                    .delete()

                    .eq("id", internshipId);


                if (error) {

                    console.error(
                        "Delete internship error:",
                        error
                    );

                    alert(
                        "Unable to delete this internship."
                    );

                    button.disabled = false;

                    return;

                }


                /* REMOVE FROM LOCAL DATA */

                internshipItems =
                    internshipItems.filter(
                        item => item.id !== internshipId
                    );


                loadFilterOptions();

                renderInternships();


                alert(
                    "Internship deleted successfully."
                );

            }

            catch (error) {

                console.error(
                    "Unexpected delete error:",
                    error
                );

                alert(
                    "An error occurred while deleting the internship."
                );

                button.disabled = false;

            }

        }


        /* =========================================
           ACTION BUTTONS
        ========================================= */

        internshipList.addEventListener(
            "click",
            async function(event) {

                const button =
                    event.target.closest("button[data-action]");

                if (!button) {
                    return;
                }


                const action = button.dataset.action;

                const internshipId = button.dataset.id;


                if (action === "approve") {

                    await updateApprovalStatus(
                        button,
                        internshipId,
                        "approved"
                    );

                }


                if (action === "reject") {

                    await updateApprovalStatus(
                        button,
                        internshipId,
                        "rejected"
                    );

                }


                if (action === "delete") {

                    await deleteInternship(
                        button,
                        internshipId
                    );

                }

            }
        );


        /* =========================================
           SEARCH EVENT
        ========================================= */

        searchInput.addEventListener(
            "input",
            filterInternships
        );


        /* =========================================
           APPLICATION STATUS EVENT
        ========================================= */

        statusFilter.addEventListener(
            "change",
            filterInternships
        );


        /* =========================================
           APPROVAL STATUS EVENT
        ========================================= */

        approvalFilter.addEventListener(
            "change",
            filterInternships
        );


        /* =========================================
           FIELD EVENT
        ========================================= */

        fieldFilter.addEventListener(
            "change",
            filterInternships
        );


        /* =========================================
           CITY EVENT
        ========================================= */

        cityFilter.addEventListener(
            "change",
            filterInternships
        );


        /* =========================================
           LOGOUT
        ========================================= */

        logoutButton.addEventListener(
            "click",
            async function(event) {

                event.preventDefault();

                try {

                    await db.auth.signOut();

                }

                catch (error) {

                    console.error(
                        "Logout error:",
                        error
                    );

                }


                localStorage.removeItem("username");

                localStorage.removeItem("role");


                window.location.href = "index.html";

            }
        );


        /* =========================================
           START
        ========================================= */

        loadInternships();

    </script>

</body>

</html>
